    function openInline(el) {
      if (!canEdit() || editing) return;
      const field = el.dataset.edit;
      const capId = el.dataset.editTarget || null;
      const spec = (capId ? INLINE_CAP : INLINE)[field];
      if (!spec) return;
      // Whichever record is on screen. The theater speaks the raw payload and
      // the sheet speaks the adapted one; both carry the same field names for
      // everything this table touches.
      const rec = capId
        ? ((thS ?? current)?.captures || []).find((c) => c.id === capId)
        : (!TH.root.hidden && thS ? thS : current);
      if (!rec) return;

      editing = { el, spec, rec, capId, html: el.innerHTML };
      el.classList.add('editing');
      el.innerHTML = spec.textarea
        ? `<textarea class="inline-in" rows="3"></textarea>`
        : `<input class="inline-in" type="text"${
            spec.width ? ` style="width:${spec.width}px"` : ''}${
            spec.wide ? ' data-wide' : ''}>`;
      const f = el.querySelector('.inline-in');
      f.value = spec.get(rec);
      f.focus();
      f.select();
    }

    async function commitInline() {
      if (!editing) return;
      const { el, spec, rec, capId } = editing;
      const f = el.querySelector('.inline-in');
      if (!f) return void closeInline();
      const raw = f.value;
      const was = spec.get(rec);
      if (raw === was) return void closeInline();

      const out = spec.parse(raw, rec);
      if (out.error) {
        toast('bad', `That is not a ${spec.label}`, out.error, 5000);
        f.focus();
        return;
      }
      closeInline();
      await submit([{
        target_type: capId ? 'capture' : 'stream',
        target_id: capId ?? rec.id,
        op: 'update', field: spec.write, value: out.value,
      }], `edited ${spec.label}`, { after: refreshOpenViews });
    }

    function bindInline(root) {
      root.addEventListener('dblclick', (e) => {
        const el = e.target.closest('[data-edit]');
        if (!el || editing) return;
        e.preventDefault();
        e.stopPropagation();
        // Tags have an editor already. Sending them somewhere else would be a
        // second way to do one thing.
        if (el.dataset.edit === 'tags') {
          const add = el.querySelector('[data-tagadd]');
          const rec = (!TH.root.hidden && thS) ? thS : current;
          if (add && rec) openTagPicker(add, rec.id, rec.tagRows ?? rec.tags ?? []);
          return;
        }
        openInline(el);
      });
      root.addEventListener('keydown', (e) => {
        if (!editing || !e.target.classList?.contains('inline-in')) return;
        if (e.key === 'Escape') { e.stopPropagation(); closeInline(); }
        // Enter commits, except in a textarea where it is a newline and the
        // blur does the committing.
        else if (e.key === 'Enter' && !editing.spec.textarea) { e.preventDefault(); commitInline(); }
        else if (e.key === 'Enter' && e.metaKey) { e.preventDefault(); commitInline(); }
      });
      root.addEventListener('focusout', (e) => {
        if (editing && e.target.classList?.contains('inline-in')) commitInline();
      });
    }
    bindInline(sheet);
    bindInline(TH.root);
    /* =====================================================================
       The record: create, edit, delete
       =====================================================================
       Inline editing covers the fields that are on screen. This covers the
       rest — the ones nothing displays, and the captures, which have no other
       home anywhere in the app. Same field table where they overlap, so a
       duration typed here and a duration typed on the sheet go through one
       parser and one validator. */

    const pop5 = Object.assign(document.createElement('div'),
      { className: 'pop2 pop5', hidden: true });
    document.body.append(pop5);
    let rec5 = null;      // { mode:'new'|'edit', id, stream }

    /* Fields with no home on any surface. `started_at`, `title`, `idx`,
       `duration_s` and `thumb_path` come from INLINE so the parsing is shared. */
    const REC_EXTRA = [
      ['tz_offset_min', 'tz offset (hours)', 'hours',
       'Hours from UTC for the local date and time. −5 is US Eastern in summer. '
       + 'Halves are fine — −5.5, +5.75 — because those zones exist.'],
      // vod_state and chat_state were here as enums. They are derived —
      // recompute() rewrites them on the next write — so editing one saved
      // and then silently reverted. The way to change a state is to correct
      // the path it is derived from, which is what these two do.
      ['chat_path', 'merged chat path', 'text',
       'The unified chat for the whole stream, relative to the media root. '
       + 'Setting this makes it the chat; clearing it falls back to the per-capture logs.'],
      ['chat_sources', 'chat platforms', 'text',
       'Which platforms are inside the merged file. YT, TW, or YT,TW.'],
    ];
    const REC_MAIN = ['idx', 'title', 'when', 'duration', 'thumb', 'serve'];

    /* Two REC_MAIN rows want a widget rather than a text box. The INLINE spec
       still owns get/parse, so the stored value and the validation are shared
       with the double-click editor — only the input differs. */
    const REC_MAIN_TYPE = {
      thumb: 'pick:image',
      serve: 'pills:|auto,YT|YouTube,TW|Twitch',
    };

    /* url comes before remote id because the id is filled in from it. Both are
       still written: remote_id is the key ls-rec upserts on, so it has to be
       correctable when the parse is wrong or the url points at a mirror.

       chat_path is gone — chat is a property of the stream now, and the merged
       path in the section above is where it is set. thumb_path is gone too:
       thumbFor() already falls back capture → YouTube hqdefault, and the
       thumbnail worth choosing is the stream's, which is the one on the card.

       The three clocks stay. They are measurements, not anything derived from a
       url, and this is the only place a wrong one can be corrected by hand. */
    const CAP_FIELDS = [
      ['platform', 'platform', 'enum:YT,TW'],
      ['url', 'url', 'text'],
      ['remote_id', 'remote id', 'text'],
      ['video_path', 'hosted video', 'pick:video'],
      ['mirror_url', 'mirror url', 'text'],
      ['remote_start_wall', 'platform t=0 (unix)', 'int'],
      ['local_start_wall', 'recording t=0 (unix)', 'int'],
      ['file_duration_s', 'file length (s)', 'int'],
    ];

    /* The id inside a watch url, for the two platforms that exist here.
       Returns null rather than guessing — a url it does not recognise leaves
       whatever is already in the field alone. */
    function remoteIdFromUrl(url, platform) {
      const u = String(url || '').trim();
      if (!u) return null;
      const yt = u.match(/(?:youtu\.be\/|[?&]v=|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
      if (yt) return yt[1];
      const tw = u.match(/twitch\.tv\/videos\/(\d+)/);
      if (tw) return tw[1];
      return platform === 'TW' ? (u.match(/^\d{8,}$/) ? u : null) : null;
    }

    /* Minutes on the wire, hours in the box.
       The column stays minutes because half-hour zones exist and always will —
       India is +5:30, Nepal +5:45 — so storing hours would quietly make those
       unrepresentable. Only the input is converted, and it accepts a fraction
       for exactly that reason. */
    const minToHr = (m) => (m === null || m === undefined || m === '') ? ''
      : String(Number(m) / 60);
    const hrToMin = (h) => Math.round(Number(h) * 60);

    const recField = (key, type, value) => {
      if (type.startsWith('enum:')) {
        return `<select data-r="${esc(key)}"><option value=""></option>${
          type.slice(5).split(',').map((o) =>
            `<option value="${esc(o)}"${o === value ? ' selected' : ''}>${esc(o)}</option>`)
          .join('')}</select>`;
      }
      if (type.startsWith('pills:')) {
        // A hidden input carries the value, so the save path reads pills exactly
        // the way it reads every other row and needs to know nothing about them.
        const cur = String(value ?? '');
        return `<span class="rec-pills" data-pills="${esc(key)}">${
          type.slice(6).split(',').map((pair) => {
            const [v, lab] = pair.split('|');
            return `<button type="button" data-v="${esc(v)}"
              aria-pressed="${String(v === cur)}">${esc(lab || v || 'auto')}</button>`;
          }).join('')}</span><input type="hidden" data-r="${esc(key)}" value="${esc(cur)}">`;
      }
      if (type.startsWith('pick:')) {
        return `<span class="rec-pick">
          <input data-r="${esc(key)}" type="text" value="${esc(value ?? '')}"
            autocomplete="off" spellcheck="false">
          <button type="button" data-browse="${esc(key)}"
            data-kind="${esc(type.slice(5))}" title="Pick a file on the server">…</button>
        </span>`;
      }
      if (type === 'hours') {
        return `<input data-r="${esc(key)}" data-unit="hours" type="text"
          value="${esc(minToHr(value))}" autocomplete="off" spellcheck="false">`;
      }
      return `<input data-r="${esc(key)}" type="text" value="${esc(value ?? '')}"
        autocomplete="off" spellcheck="false">`;
    };

    const recRow = (key, label, type, value, hint) => `
      <label class="rec-row">
        <span>${esc(label)}</span>
        ${recField(key, type, value)}
      </label>${hint ? `<span class="rec-hint">${esc(hint)}</span>` : ''}`;

    function openRecord(anchor, stream) {
      const isNew = !stream;
      const s = stream ?? { tz_offset_min: -300, vod_state: 'present', chat_state: 'present' };
      rec5 = { mode: isNew ? 'new' : 'edit', id: stream?.id ?? null, stream: s };

      const main = REC_MAIN.map((k) => {
        const spec = INLINE[k];
        return recRow(k, spec.label, REC_MAIN_TYPE[k] ?? 'text', spec.get(s), spec.hint);
      }).join('');
      const extra = REC_EXTRA.map(([k, label, type, hint]) =>
        recRow(k, label, type, s[k] ?? '', hint)).join('');

      const caps = (s.captures || []).map((c) => `
        <div class="rec-cap" data-cap="${esc(c.id)}">
          <div class="rec-cap-head"><b>${esc(c.platform || '?')}</b>
            <span>${esc(c.remote_id || 'no remote id')}</span>
            <button class="pop2-danger rec-capdel" data-capdel="${esc(c.id)}"
              title="Remove this capture">remove</button></div>
          ${CAP_FIELDS.map(([k, label, type]) =>
            recRow(`cap:${c.id}:${k}`, label, type, c[k] ?? '')).join('')}
        </div>`).join('');

      pop5.innerHTML = `
        <span class="pop2-lab">${isNew ? 'new stream' : `stream ${s.idx ? '#' + pad4(s.idx) : ''}`}</span>
        <div class="rec-body">
          ${main}
          <div class="pop2-sec"><span class="pop2-lab">not shown anywhere else</span>${extra}</div>
          ${isNew ? '' : `<div class="pop2-sec">
            <span class="pop2-lab">captures — the files and the four clocks</span>
            ${caps || '<div class="rec-hint">No captures on this stream.</div>'}
            <div class="pop2-btns"><button data-r-act="addcap">Add a capture</button></div>
          </div>`}
        </div>
        <div class="ch-err"></div>
        <div class="pop2-btns">
          <button data-r-act="cancel">Cancel</button>
          <button data-r-act="save" class="primary">${isNew ? 'Create' : 'Save'}</button>
        </div>`;
      pop5.hidden = false;
      placePop5(anchor);
      pop5.querySelector('input')?.focus();
    }

    function placePop5(anchor) {
      const r = anchor.getBoundingClientRect();
      const w = pop5.offsetWidth || 380;
      pop5.style.left = Math.max(8, Math.min(r.left, innerWidth - w - 8)) + 'px';
      pop5.style.top = Math.max(8, Math.min(r.bottom + 8, innerHeight - 200)) + 'px';
      pop5.style.bottom = 'auto';
      pop5.style.maxHeight = Math.max(220, innerHeight - r.bottom - 24) + 'px';
      pop5.style.overflowY = 'auto';
    }

    function closeRecord() { pop5.hidden = true; pop5.innerHTML = ''; rec5 = null; }

    /* Pick a file that exists rather than typing one that might.
       Renders under the row it belongs to, so there is never a question about
       which field is being filled, and it writes the media-root-relative path —
       `raws/697_….mp4` — because that is exactly what the column holds. */
    async function openBrowse(btn) {
      const key = btn.dataset.browse;
      const kind = btn.dataset.kind;
      const row = btn.closest('.rec-row');
      const open = row.nextElementSibling?.classList?.contains('rec-browse')
        ? row.nextElementSibling : null;
      if (open) { open.remove(); return; }
      pop5.querySelectorAll('.rec-browse').forEach((x) => x.remove());

      const panel = document.createElement('div');
      panel.className = 'rec-browse';
      panel.innerHTML = '<div class="rec-hint">loading…</div>';
      row.after(panel);

      // Start in the directory the current value already points at, so editing
      // an existing path lands you next to its neighbours rather than at the top.
      const cur = pop5.querySelector(`[data-r="${key}"]`).value.trim();
      let dir = cur.includes('/') ? cur.split('/').slice(0, -1).join('/') : 'raws';

      const draw = async (q) => {
        let d;
        try {
          d = await api('/api/media/browse?' + new URLSearchParams(
            { dir, kind, q: q ?? '' }));
        } catch (err) {
          panel.innerHTML = `<div class="rec-hint">${esc(
            err?.body?.error || 'cannot list files')}</div>`;
          return;
        }
        dir = d.dir;
        panel.innerHTML = `
          <div class="rec-browse-bar">
            <span class="rec-browse-dir">${esc('/' + (d.dir || ''))}</span>
            <input class="rec-browse-q" placeholder="filter" value="${esc(q ?? '')}">
          </div>
          <div class="rec-browse-list">
            ${d.parent !== null ? '<button type="button" data-bdir="..">../</button>' : ''}
            ${d.dirs.map((n) => `<button type="button" data-bdir="${esc(n)}">${esc(n)}/</button>`).join('')}
            ${d.files.map((f) => `<button type="button" data-bfile="${esc(f.path)}">${
              esc(f.name)}<em>${f.bytes === null ? '' : mb(f.bytes)}</em></button>`).join('')}
            ${!d.files.length && !d.dirs.length ? '<div class="rec-hint">nothing here</div>' : ''}
          </div>
          ${d.truncated ? `<div class="rec-hint">showing the newest ${
            d.files.length} of ${d.total} — use the filter</div>` : ''}`;
        panel.querySelector('.rec-browse-q').oninput = (ev) => {
          clearTimeout(panel._t);
          const v = ev.target.value;
          panel._t = setTimeout(() => draw(v), 180);
        };
        panel.querySelectorAll('[data-bdir]').forEach((b) => {
          b.onclick = () => {
            dir = b.dataset.bdir === '..'
              ? dir.split('/').slice(0, -1).join('/')
              : (dir ? `${dir}/${b.dataset.bdir}` : b.dataset.bdir);
            draw('');
          };
        });
        panel.querySelectorAll('[data-bfile]').forEach((b) => {
          b.onclick = () => {
            pop5.querySelector(`[data-r="${key}"]`).value = b.dataset.bfile;
            panel.remove();
          };
        });
      };
      draw('');
    }

    const mb = (n) => n > 1048576 ? `${(n / 1048576).toFixed(0)} MB`
      : n > 1024 ? `${(n / 1024).toFixed(0)} KB` : `${n} B`;

    /** Read the form back into changes, running every shared field through the
     *  same parser the inline editor uses. */
    function recordChanges() {
      const { mode, id, stream } = rec5;
      const sid = id ?? ulid26();
      const op = mode === 'new' ? 'create' : 'update';
      const ch = [];
      const push = (type, target, field, value) =>
        ch.push({ target_type: type, target_id: target, op: type === 'capture' && mode === 'new'
          ? 'create' : op, field, value });

      for (const k of REC_MAIN) {
        const spec = INLINE[k];
        const raw = pop5.querySelector(`[data-r="${k}"]`).value;
        if (mode === 'edit' && raw === spec.get(stream)) continue;
        const out = spec.parse(raw, { ...stream, tz_offset_min:
          Number(pop5.querySelector('[data-r="tz_offset_min"]').value || 0) });
        if (out.error) return { error: `${spec.label}: ${out.error}` };
        if (mode === 'new' && (out.value === null || out.value === '')) continue;
        ch.push({ target_type: 'stream', target_id: sid, op, field: spec.write, value: out.value });
      }
      for (const [k] of REC_EXTRA) {
        const el = pop5.querySelector(`[data-r="${k}"]`);
        const raw = el.value.trim();
        let value;
        if (el.dataset.unit === 'hours') {
          // Compared after conversion, not before: `-5` and `-300` are the same
          // answer, and comparing the typed string to the stored minutes would
          // mark every unchanged row as an edit.
          if (raw !== '' && !Number.isFinite(Number(raw))) {
            return { error: 'tz offset: hours from UTC, e.g. -5 or -5.5.' };
          }
          value = raw === '' ? null : hrToMin(raw);
          if (value !== null && !Number.isInteger(value)) {
            return { error: 'tz offset: that many hours is not a whole number of minutes.' };
          }
          if (mode === 'edit' && value === (stream[k] ?? null)) continue;
        } else {
          if (mode === 'edit' && raw === String(stream[k] ?? '')) continue;
          value = raw === '' ? null : raw;
        }
        if (mode === 'new' && value === null) continue;
        ch.push({ target_type: 'stream', target_id: sid, op, field: k, value });
      }
      if (mode === 'new' && !ch.some((c) => c.field === 'title')) {
        return { error: 'A stream needs a title.' };
      }
      if (mode === 'new' && !ch.some((c) => c.field === 'started_at')) {
        return { error: 'A stream needs a start time — that is the axis zero.' };
      }

      for (const box of pop5.querySelectorAll('[data-cap]')) {
        const cid = box.dataset.cap;
        const cap = (stream.captures || []).find((c) => c.id === cid) ?? {};
        for (const [k] of CAP_FIELDS) {
          const el = pop5.querySelector(`[data-r="cap:${cid}:${k}"]`);
          if (!el) continue;
          const raw = el.value.trim();
          const was = cap[k] ?? '';
          if (raw === String(was)) continue;
          const num = ['remote_start_wall', 'local_start_wall', 'file_duration_s'].includes(k);
          const value = raw === '' ? null : (num ? Number(raw) : raw);
          if (num && raw !== '' && !Number.isFinite(value)) {
            return { error: `${k}: a whole number of seconds.` };
          }
          ch.push({ target_type: 'capture', target_id: cid, op: 'update', field: k, value });
        }
      }
      return { changes: ch, id: sid };
    }

    /* Filling the id from the url, without ever overwriting a deliberate one.
       The rule is: replace it only while it still matches what the previous url
       produced. Type your own and it is left alone from then on. */
    pop5.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset?.r || !el.dataset.r.endsWith(':url')) return;
      const cid = el.dataset.r.split(':')[1];
      const idEl = pop5.querySelector(`[data-r="cap:${cid}:remote_id"]`);
      const platEl = pop5.querySelector(`[data-r="cap:${cid}:platform"]`);
      if (!idEl) return;
      const derived = remoteIdFromUrl(el.value, platEl?.value);
      if (!derived) return;
      const prev = el.dataset.wasDerived ?? '';
      if (idEl.value.trim() === '' || idEl.value.trim() === prev) {
        idEl.value = derived;
        idEl.classList.add('rec-derived');
      }
      el.dataset.wasDerived = derived;
    });

    pop5.addEventListener('click', async (e) => {
      const pill = e.target.closest('[data-pills] button');
      if (pill) {
        e.stopPropagation();
        const wrap = pill.closest('[data-pills]');
        wrap.querySelectorAll('button').forEach((x) =>
          x.setAttribute('aria-pressed', String(x === pill)));
        pop5.querySelector(`[data-r="${wrap.dataset.pills}"]`).value = pill.dataset.v;
        return;
      }
      const br = e.target.closest('[data-browse]');
      if (br) { e.stopPropagation(); return void openBrowse(br); }
      if (e.target.closest('.rec-browse')) { e.stopPropagation(); return; }
      e.stopPropagation();
      const b = e.target.closest('[data-r-act], [data-capdel]');
      if (!b) return;
      if (b.dataset.capdel) {
        const cid = b.dataset.capdel;
        closeRecord();
        return void await submit([{ target_type: 'capture', target_id: cid, op: 'delete' }],
          'removed a capture', { after: refreshOpenViews });
      }
      if (b.dataset.rAct === 'cancel') return void closeRecord();
      if (b.dataset.rAct === 'addcap') {
        const sid = rec5.id;
        closeRecord();
        const cid = ulid26();
        return void await submit([
          { target_type: 'capture', target_id: cid, op: 'create', field: 'stream_id', value: sid },
          { target_type: 'capture', target_id: cid, op: 'create', field: 'platform', value: 'YT' },
        ], 'added a capture', { after: refreshOpenViews });
      }
      if (b.dataset.rAct === 'save') {
        const out = recordChanges();
        if (out.error) { pop5.querySelector('.ch-err').textContent = out.error; return; }
        if (!out.changes.length) { closeRecord(); return void toast('queued', 'Nothing changed', null, 2500); }
        const mode = rec5.mode;
        closeRecord();
        await submit(out.changes, mode === 'new' ? 'created a stream' : 'edited a stream', {
          after: async () => {
            // The grid is drawn from a cached month list, and this form can
            // change a card's date, number or title — or add a whole card.
            // Refreshing only the open sheet would leave the grid lying.
            monthCache.clear();
            await showMonth();
            if (mode === 'new') await openStream(out.id);
            else await refreshOpenViews();
          },
        });
      }
    });

    /* ---- delete, with a way back ----------------------------------------
       A corner icon on a grid you click constantly is one slip from losing a
       stream, so: a confirm that names it, and an Undo on the toast. The
       retraction is liftable because `retracted_at` is writable — it was not,
       which is what made this button unbuildable as first described. */
    function confirmDelete(anchor, s) {
      openPop(anchor, `
        <span class="pop2-lab">delete stream ${s.idx ? '#' + pad4(s.idx) : ''}</span>
        <div class="rec-hint" style="margin-top:6px">${esc(s.title)}</div>
        <div class="pop2-scope">Tombstoned, not erased — the row stays, and the
          changeset that hid it stays with it.</div>
        <div class="pop2-btns">
          <button data-del-act="cancel">Cancel</button>
          <button data-del-act="go" class="pop2-danger">Delete</button>
        </div>`, { kind: 'del', stream: s });
    }

    pop2.addEventListener('click', async (e) => {
      e.stopPropagation();
      const b = e.target.closest('[data-del-act]');
      if (!b || pop2Ctx?.kind !== 'del') return;
      const s = pop2Ctx.stream;
      closePop();
      if (b.dataset.delAct !== 'go') return;
      const r = await submit([{ target_type: 'stream', target_id: s.id, op: 'delete' }],
        `deleted ${s.idx ? '#' + pad4(s.idx) : s.title.slice(0, 30)}`, {
          after: async () => { monthCache.clear(); closeSheet(); await showMonth(); },
        });
      if (r?.status !== 'applied') return;
      toast('applied', 'Deleted', 'It is tombstoned, not erased.', 12000, {
        label: 'Undo',
        run: async () => {
          await submit([{ target_type: 'stream', target_id: s.id, op: 'update',
                          field: 'retracted_at', value: null }],
            'undid a delete', { after: async () => { monthCache.clear(); await showMonth(); } });
        },
      });
    });

    document.getElementById('cal-new').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!pop5.hidden) return void closeRecord();
      openRecord(e.currentTarget, null);
    });

    calVods.addEventListener('click', (e) => {
      const wr = e.target.closest('[data-wrench]');
      if (wr) {
        e.stopPropagation();
        return void (async () => {
          if (!pop5.hidden) return closeRecord();
          try {
            const full = adapt(await api(`/api/streams/${encodeURIComponent(wr.dataset.wrench)}`));
            openRecord(wr, full);
          } catch (err) { offline(err); }
        })();
      }
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        const s = vodMap[del.dataset.del];
        if (s) confirmDelete(del, s);
      }
    }, true);

    document.addEventListener('click', (e) => {
      if (pop5.hidden) return;
      // Every control that OPENS this popover is listed, and every one of them
      // also calls stopPropagation, so today this line is belt over braces —
      // removing an entry breaks no test. It stays because stopPropagation is
      // one refactor away from disappearing, and the failure it would cause is
      // the popover opening and closing on the same click, which reads as the
      // button doing nothing at all.
      if (pop5.contains(e.target)
          || e.target.closest('[data-wrench], [data-thwrench], #cal-new')) return;
      closeRecord();
    });
    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !pop5.hidden) { e.stopImmediatePropagation(); closeRecord(); }
    }, true);

    /* ---- wiring ----------------------------------------------------------- */
    function tagClicks(root, getTags, getStreamId) {
      root.addEventListener('click', (e) => {
        const add = e.target.closest('[data-tagadd]');
        if (add) {
          e.stopPropagation();
          return void openTagPicker(add, add.dataset.tagadd, getTags());
        }
        const chip = e.target.closest('[data-tagchip]');
        if (chip) {
          e.stopPropagation();
          const t = getTags().find((x) => x.id === chip.dataset.tagchip);
          if (t) openTagEditor(chip, t, getStreamId());
        }
      });
    }
    tagClicks(sheet, () => current?.tagRows ?? [], () => current?.id);
    tagClicks(TH.root, () => thS?.tags ?? [], () => thS?.id);

    /* =====================================================================
       Boot
       ===================================================================== */
    async function goMonth(step) {
      closeDay();
      viewM += step;
      if (viewM < 0) { viewM = 11; viewY--; } else if (viewM > 11) { viewM = 0; viewY++; }
      clearVod();
      await showMonth();
    }
    async function showMonth() {
      calTitle.textContent = MONTHS[viewM] + ' ' + viewY;
      try { calList = await loadMonth(monthKey()); }
      catch (e) { calList = []; offline(e); }
      renderCalendar();
      /* Grey out navigation past either end of the real archive rather than
         letting someone scroll into empty years. */
      const keys = MONTH_INDEX.map(m => m.month);
      document.getElementById('cal-prev').disabled = !keys.some(k => k < monthKey());
      document.getElementById('cal-next').disabled = !keys.some(k => k > monthKey());
      if (!allMode) await renderStreams(); else updateCount();
    }
    document.getElementById('cal-prev').onclick = () => goMonth(-1);
    document.getElementById('cal-next').onclick = () => goMonth(1);

    (async function boot() {
      renderNotes();
      renderWho();          // before the fetches: a failed one must not take
                            // the whole identity control down with it
      try {
        const [m, me] = await Promise.all([
          api('/api/months'),
          api('/api/auth/me').catch(() => null),
        ]);
        MONTH_INDEX = m.months || [];
        if (me) ME = me;
        renderWho();
        // Land on the newest month that actually has streams, not on today.
        if (MONTH_INDEX.length) {
          const [y, mm] = MONTH_INDEX[0].month.split('-').map(Number);
          viewY = y; viewM = mm - 1;
        }
      } catch (e) { offline(e); }
      await showMonth();
      const w = location.hash.match(/^#\/w\/([0-9A-Za-z]{26})(?:@(\d+))?$/);
      const m = location.hash.match(/^#\/s\/([0-9A-Za-z]{26})$/);
      if (w) openTheater(w[1], w[2] ? Number(w[2]) : 0);
      else if (m) openStream(m[1]);
    })();
  </script>
</body>
</html>
