        : 'chat replay is not built yet';
    }

    /* Repaint the parts that move with the playhead. Called on a timer while a
       player is running, so it does no layout work beyond two style writes. */
    function thPaint() {
      const D = domainOf(thS);
      if (!D) return;
      TH.head.style.left = thPct(thAxis) + '%';

      const seg = (thS.segments || []).find((s) => thAxis >= s.start_s && thAxis < s.end_s);
      const sw = TH.now.querySelector('i'), nm = TH.now.querySelector('b'),
            sub = TH.now.querySelector('span');
      if (seg) {
        sw.style.background = seg.kind === 'unknown' ? 'var(--surface-3)' : `var(--seg-${seg.kind})`;
        nm.textContent = seg.label || KIND_LABEL[seg.kind] || seg.kind;
        const into = Math.round((thAxis - seg.start_s) / 60);
        const len = Math.round((seg.end_s - seg.start_s) / 60);
        sub.textContent = `· ${into}m into a ${len >= 60 ? `${Math.floor(len / 60)}h${pad2(len % 60)}m` : `${len}m`} block`;
      } else {
        nm.textContent = '—'; sub.textContent = '';
      }

      // The most recent note at or before the playhead — found in TIME order,
      // highlighted wherever the tag grouping happens to have put its row.
      let cur = null;
      for (const n of (thS.notes || [])) {
        if (n.start_s !== null && n.start_s <= thAxis) cur = n.id;
      }
      TH.notes.querySelectorAll('.nt').forEach((el) =>
        el.classList.toggle('on', el.dataset.thnote === cur));
    }

    /* ---- open / close ---------------------------------------------------- */

    async function openTheater(id, atAxis) {
      try {
        let s = thCache.get(id);
        if (!s) { s = await api(`/api/streams/${encodeURIComponent(id)}?rail=5`); thCache.set(id, s); }
        thS = s;
        thAxis = atAxis ?? 0;

        // Same fields, same table, same double-click as the sheet — see INLINE.
        TH.idx.innerHTML = ed('idx', s.idx ? '#' + pad4(s.idx) : '#—');
        TH.idx.hidden = false;
        TH.title.innerHTML = ed('title', esc(s.title || '(untitled)'));
        TH.tags.innerHTML = tagsRowHtml(s.tags, s.id);
        TH.metapills.innerHTML = [
          ed('when', esc(`${s.date} ${s.start_sod === null || s.start_sod === undefined
            ? '' : hhmm(s.start_sod)}`.trim()), { cls: 'pill' }),
          ed('duration', esc(s.duration || '—'), { cls: 'pill', title: 'How long it ran' }),
          stateIcon('vod', s.vod_state),
          stateIcon('chat', s.chat?.state ?? s.chat_state),
          ed('serve', esc(s.serve_pref || 'auto'), { cls: 'pill', title: 'Default source' }),
          s.axis?.duration_source
            ? `<span class="pill" title="Where that length came from">length: ${
                esc(s.axis.duration_source)}</span>` : null,
        ].filter(Boolean).join('');

        thRenderRail();
        thRenderTimeline();
        thRenderPanel();

        TH.root.hidden = false;
        document.body.classList.add('th-open');
        document.body.classList.remove('sheet-open');
        sheet.classList.remove('open');
        history.replaceState(null, '', `#/w/${s.id}`);

        // Lead first, then whatever else is playable. A source with no clock is
        // skipped rather than mounted blind.
        const playable = (s.sources || []).filter(
          (w) => (w.embeddable || w.kind === 'local') && w.available !== 'dead' && covStart(w) !== null);
        const lead = playable.find((w) => w.capture_id === s.lead && w.embeddable) || playable[0];
        if (lead) await thMount(lead, thAxis);
        else {
          TH.player.innerHTML = thGone(
            s.vod_state === 'never' ? 'Nothing was ever captured'
              : s.vod_state === 'lost' ? 'Every copy of this is gone'
              : 'No playable source',
            s.vod_state === 'never'
              ? 'We know this broadcast happened. That is the whole record.'
              : 'The notes below are what survives of it.');
        }

        thPaint();
        clearInterval(thTick);
        thTick = setInterval(() => {
          const a = thAxisNow();
          if (Math.abs(a - thAxis) > 0.25) { thAxis = a; thPaint(); }
        }, 250);
      } catch (e) { offline(e); }
    }

    function thTeardown() {
      clearInterval(thTick); thTick = null;
      if (thPlay) { try { thPlay.destroy(); } catch { /* ignore */ } thPlay = null; }
      TH.player.innerHTML = '';
      thSrc = null;
    }
    function closeTheater(back) {
      if (TH.root.hidden) return;
      thTeardown();
      document.body.classList.remove('th-open');
      setTimeout(() => { TH.root.hidden = true; }, 340);
      if (back && thS) {
        // Esc walks down one layer: theater -> details -> index.
        openStream(thS.id);
      } else if (location.hash.startsWith('#/w/')) {
        history.replaceState(null, '', location.pathname);
      }
      thS = null;
    }

    /* ---- interaction ----------------------------------------------------- */

    document.getElementById('th-close').onclick = () => closeTheater(false);
    document.getElementById('th-min').onclick = () => closeTheater(true);
    TH.scrim.onclick = () => closeTheater(true);

    document.getElementById('th-copy').onclick = (e) => {
      // The share link carries the axis position, not a platform t= — a link
      // that bakes in youtube.com?t= dies with the VOD, which is the one
      // failure this archive exists to survive.
      const url = `${location.origin}${location.pathname}#/w/${thS.id}@${Math.round(thAxis)}`;
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      const b = e.currentTarget; b.classList.add('copied');
      b.title = 'Copied'; setTimeout(() => { b.title = 'Copy link to this moment'; }, 1200);
    };

    /* Double-clicking a source opens the record editor, which is where the
       urls, the file paths and the four clocks live. The theater has no other
       surface for them, and giving it a second one would be a second place for
       the same validation to be slightly different. */
    TH.srcbar.addEventListener('dblclick', (e) => {
      if (!ME.can?.edit || !thS) return;
      e.preventDefault();
      e.stopPropagation();
      openRecord(e.target.closest('button') ?? TH.srcbar, thS);
    });

    TH.srcbar.addEventListener('click', (e) => {
      if (e.target.closest('[data-thwrench]')) {
        e.stopPropagation();
        if (!pop5.hidden) return closeRecord();
        if (ME.can?.edit && thS) openRecord(e.target.closest('button'), thS);
        return;
      }
      const b = e.target.closest('[data-thsrc]');
      if (!b || b.disabled) return;
      thAxis = thAxisNow();
      thMount(thS.sources[+b.dataset.thsrc], thAxis);
    });

    TH.rail.addEventListener('click', (e) => {
      const b = e.target.closest('[data-thnb]');
      if (!b || b.getAttribute('aria-current')) return;
      thTeardown();
      openTheater(b.dataset.thnb, 0);
    });
    document.querySelectorAll('.th-strip-nav').forEach((b) => {
      b.onclick = () => TH.rail.scrollBy({ left: 360 * Number(b.dataset.scroll) });
    });

    document.getElementById('th-panel-hide').onclick = (e) => {
      TH.root.classList.toggle('panel-hidden');
      e.currentTarget.style.transform =
        TH.root.classList.contains('panel-hidden') ? 'scaleX(-1)' : '';
    };
    document.querySelectorAll('.th-seg-ctl button').forEach((b) => {
      b.onclick = () => {
        document.querySelectorAll('.th-seg-ctl button').forEach((x) =>
          x.setAttribute('aria-selected', String(x === b)));
        TH.notes.hidden = b.dataset.tab !== 'notes';
        TH.chat.hidden = b.dataset.tab !== 'chat';
        thPanelCount();
      };
    });
    document.getElementById('th-jump').onclick = () => {
      const on = TH.notes.querySelector('.nt.on');
      if (on) on.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };

    TH.notes.addEventListener('click', (e) => {
      const el = e.target.closest('[data-thnote]');
      if (!el) return;
      const n = (thS.notes || []).find((x) => x.id === el.dataset.thnote);
      if (n && n.start_s !== null && n.start_s !== undefined) thSeek(n.start_s);
    });

    TH.tlbody.addEventListener('pointermove', (e) => {
      if (!domainOf(thS)) return;
      if (drawPointerMove(e)) return;   // draw mode owns the hairline and bubble
      const r = TH.tlbody.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
      TH.hair.style.left = x + 'px';
      if (TH.pop.classList.contains('on')) { TH.bubble.classList.remove('on'); return; }
      TH.bubble.style.left = Math.min(Math.max(x, 34), r.width - 34) + 'px';
      TH.bubble.textContent = thHms((x / r.width) * domainOf(thS));
      TH.bubble.classList.add('on');
    });
    TH.tlbody.addEventListener('pointerleave', () => TH.bubble.classList.remove('on'));

    TH.pins.addEventListener('pointerover', (e) => {
      const pin = e.target.closest('.th-pin'); if (!pin) return;
      const n = thPinned[+pin.dataset.thpin]; if (!n) return;
      pin.classList.add('on');
      TH.pop.innerHTML = `<div class="pop-t"><span class="pop-tag">${esc(n.tag || 'note')}</span>
          <span class="pop-ts">${esc(n.at || thHms(n.start_s))}${
            n.exact ? '' : ` ±${n.precision_s ?? '?'}s`}</span></div>
        <div class="pop-x">${esc(n.text)}</div>
        <span class="pop-go">${n.exact ? 'click to jump here' : 'approximate — click to jump near here'}</span>`;
      const r = TH.tlbody.getBoundingClientRect();
      const x = thPct(n.start_s) / 100 * r.width;
      TH.pop.style.left = Math.min(Math.max(x, 128), r.width - 128) + 'px';
      TH.pop.classList.add('on');
      TH.bubble.classList.remove('on');
    });
    TH.pins.addEventListener('pointerout', (e) => {
      const pin = e.target.closest('.th-pin'); if (!pin) return;
      pin.classList.remove('on'); TH.pop.classList.remove('on');
    });
    TH.pins.addEventListener('click', (e) => {
      const pin = e.target.closest('.th-pin'); if (!pin) return;
      e.stopPropagation();
      const n = thPinned[+pin.dataset.thpin];
      if (n) thSeek(n.start_s);
    });
    TH.tlbody.addEventListener('click', (e) => {
      const D = domainOf(thS); if (!D) return;
      // One listener, one decision. A second listener racing this one over
      // whether a click was a seek is how a timeline starts jumping.
      if (drawClick(e)) return;
      const r = TH.tlbody.getBoundingClientRect();
      thSeek(Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * D);
    });

    /* Esc walks down one layer at a time: theater -> details -> index. The
       existing handler already closes the sheet, so this one runs first and
       stops there. */
    addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || TH.root.hidden) return;
      // A popover on top of the theater owns Escape first, or dismissing an
      // autocomplete would drop you out of the whole watch view. Same for the
      // chapter form and for draw mode: both are layers, and Escape leaves one
      // layer at a time.
      if (popOpen() || drawOn) return;
      e.stopImmediatePropagation();
      closeTheater(true);
    }, true);


    /* =====================================================================
       WRITE — identity, one changeset primitive, and the tag editor
       =====================================================================
       Everything that will ever write to this archive goes through submit()
       below. There is no PATCH on the server and there is no second path
       here: a change is a list of {target_type, target_id, op, field, value}
       rows, and the only thing that varies between an editor and a viewer is
       whether the server applies it now or queues it for review.
       ===================================================================== */

    async function apiPost(path, body) {
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify(body ?? {}),
      });
      let json = null;
      try { json = await r.json(); } catch { /* 204 and friends */ }
      return { status: r.status, body: json };
    }

    /* ---- toasts ---------------------------------------------------------- */
    const toastBox = Object.assign(document.createElement('div'), { className: 'toasts' });
    document.body.append(toastBox);
    function toast(kind, head, sub, ms = 5000, action = null) {
      const el = document.createElement('div');
      el.className = `toast ${kind}`;
      el.innerHTML = `<b>${esc(head)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}${
        action ? `<button class="toast-act">${esc(action.label)}</button>` : ''}`;
      // The one place a destructive action gets a way back. It lives on the
      // toast because that is where you are looking a second after the mistake.
      if (action) {
        el.querySelector('.toast-act').addEventListener('click', (e) => {
          e.stopPropagation();
          el.remove();
          action.run();
        });
      }
      toastBox.append(el);
      setTimeout(() => el.remove(), ms);
      return el;
    }

    /* ---- the one write primitive ------------------------------------------
       Applied or queued is the whole point. A suggester's change is accepted
       and then invisible until someone reviews it; saying so every time is
       what stops it reading as "nothing happened". */
    async function submit(changes, reason, { after } = {}) {
      if (!ME.can?.suggest) {
        toast('bad', 'You are signed out', 'Sign in before changing anything.');
        return null;
      }
      const r = await apiPost('/api/changesets', { reason, changes });
      if (r.status === 401 || r.status === 403) {
        toast('bad', 'Not allowed', r.body?.error ?? 'Your role cannot make this change.');
        return null;
      }
      if (r.status === 409) {
        // Somebody edited the same field first. The server hands back both
        // values rather than picking one.
        const c = r.body?.conflicts?.[0];
        toast('bad', 'Someone got there first',
          c ? `${c.field} is now "${c.current}", not "${c.proposed_against}".`
            : (r.body?.error ?? 'Values changed since this was written.'), 9000);
        return null;
      }
      if (r.status !== 200) {
        toast('bad', 'Refused', r.body?.error ?? `HTTP ${r.status}`, 9000);
        return null;
      }
      if (r.body.status === 'applied') {
        toast('applied', reason || 'Done', 'Applied. It is in the history.');
      } else {
        toast('queued', reason || 'Suggested',
          'Queued for review — nothing has changed on the page yet.', 7000);
      }
      if (after) await after(r.body);
      return r.body;
    }

    /* ---- identity ----------------------------------------------------------
       The dev sign-in mints a session for any handle with no verification at
       all, which is why the server only exposes it under TENMA_DEV_AUTH and
       why the badge says so in red. Replacing auth means replacing identify()
       in auth.js; this control just has to stop existing. */
    const whoBox = Object.assign(document.createElement('div'), { className: 'who' });
    document.querySelector('.topbar-inner')?.append(whoBox);

    function renderWho() {
      const tools = document.getElementById('cal-tools');
      if (tools) tools.hidden = !ME.can?.edit;
      const can = ME.can ?? {};
      const role = ME.role ?? 'viewer';
      const signedIn = role !== 'viewer' || ME.id;
      const why = ME.dev_auth
        ? 'Signed in through dev auth — no verification whatsoever'
        : signedIn ? 'Signed in'
        : 'Read-only. There is no sign-in yet: start the server with '
          + 'TENMA_DEV_AUTH=1 to get one during development, or replace '
          + 'identify() in auth.js with real auth.';
      whoBox.innerHTML = `
        ${ME.dev_auth ? '<span class="who-dev" title="TENMA_DEV_AUTH is on — anyone can become anyone">dev auth</span>' : ''}
        ${signedIn ? `<span class="who-name">as <b>${esc(ME.handle ?? '?')}</b></span>` : ''}
        <span class="who-role${can.edit ? ' can-edit' : ''}" title="${esc(why)}">${esc(role)}</span>
        ${ME.dev_auth
          ? `<button class="btn-ghost" data-who="${signedIn ? 'out' : 'in'}">${signedIn ? 'sign out' : 'sign in'}</button>`
          : '<span class="who-note" title="' + esc(why) + '">read-only</span>'}`;
    }

    whoBox.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-who]'); if (!b) return;
      if (b.dataset.who === 'out') {
        await apiPost('/api/auth/logout');
        ME = { role: 'viewer', can: {}, dev_auth: ME.dev_auth };
        renderWho(); await reskin(); refreshOpenViews();
        return;
      }
      const handle = prompt('Sign in as (dev only — no verification whatsoever):', 'me');
      if (!handle) return;
      const role = prompt('Role: viewer | suggester | editor | admin', 'editor');
      if (!role) return;
      const r = await apiPost('/api/auth/token', { handle, role });
      if (r.status !== 200) return void toast('bad', 'Sign-in failed', r.body?.error);
      ME = await api('/api/auth/me');
      renderWho(); await reskin(); refreshOpenViews();
      toast('applied', `Signed in as ${ME.handle}`,
        ME.can.edit ? 'Your changes apply immediately.' : 'Your changes will queue for review.');
    });

    /* Signing in or out changes what every surface renders — card tools, the
       + button, the editable outlines, the note field. The grid is drawn from
       a cache that a sign-in does not invalidate, so it has to be told. */
    async function reskin() {
      renderStreams();
      renderNotes();
      if (current) sMain.innerHTML = sheetHtml(current);
      if (current) sActs.innerHTML = sheetActionsHtml(current);
    }

    /** Re-pull whatever is on screen after a write or a sign-in. */
    async function refreshOpenViews() {
      const id = current?.id ?? thS?.id ?? selectedVod?.id;
      if (!id) return;
      thCache.delete(id);
      monthCache.clear();
      if (!TH.root.hidden && thS) { const at = thAxis; thTeardown(); await openTheater(id, at); }
      else if (current) await openStream(id);
      else {
        // The notes card can be showing a stream the sheet is not — picked off
        // the calendar rather than the grid. Refresh it without yanking a sheet
        // open that nobody asked for.
        try {
          const full = adapt(await api(`/api/streams/${encodeURIComponent(id)}`));
          vodMap[full.id] = full; selectedVod = full; renderNotes();
        } catch (e) { offline(e); }
      }
    }

    /* ---- tag chips ---------------------------------------------------------
       adapt() used to pick the single kind='game' tag and drop the rest, so a
       stream with two tags showed one — about 160 attachments were invisible. */
    const tagArt = (t) => t.thumb
      ? `<img class="art" src="${esc(t.thumb)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'art',textContent:'${esc((t.name || '?').slice(0, 2))}'}))">`
      : `<span class="art">${esc((t.name || '?').slice(0, 2))}</span>`;

    function tagsRowHtml(tags, streamId) {
      const chips = (tags ?? []).map((t) => `
        <button class="tagchip ${esc(t.kind ?? 'unknown')}${t.status === 'proposed' ? ' proposed' : ''}"
                data-tagchip="${esc(t.id)}" data-link="${esc(t.link_id ?? '')}"
                title="${esc(t.name)} · ${esc(KIND_LABEL[t.kind] ?? 'unlabelled')}${
                  t.status === 'proposed' ? ' — not in autocomplete yet' : ''}">
          ${tagArt(t)}<span>${esc(t.name)}</span>
        </button>`).join('');
      const add = `<button class="tag-add" data-tagadd="${esc(streamId)}"
        title="${ME.can?.suggest ? 'Add a tag' : 'Sign in to add a tag'}"
        ${ME.can?.suggest ? '' : 'disabled'}>+</button>`;
      return `<div class="tags-row" data-tags-for="${esc(streamId)}"${
        ME.can?.suggest ? ' data-edit="tags"' : ''}>${chips}
        ${chips ? '' : '<span class="tags-empty">no tags yet</span>'}${add}</div>`;
    }

    /* ---- the popover -------------------------------------------------------
       One element, moved to wherever it is needed. It lives on <body> and is
       named in the sheet's keep-open list, because the page closes the sheet
       on any click that is not inside it. */
    const pop2 = Object.assign(document.createElement('div'), { className: 'pop2', hidden: true });
    document.body.append(pop2);
    /* Asked by class, not by naming each element. There are four of these now —
       tag picker, tag editor, chapter form, note form — and every guard that
       had to list them by hand was one popover away from being wrong. */
    const popOpen = () => !!document.querySelector('.pop2:not([hidden])');
    let pop2Ctx = null;

    function openPop(anchor, html, ctx) {
      pop2Ctx = ctx;
      pop2.innerHTML = html;
      pop2.hidden = false;
      // Stays on <body>. Both #sheet and #th carry a transform for their
      // slide-up, and a transformed ancestor makes position:fixed resolve
      // against THAT box instead of the viewport — parenting the popover into
      // the sheet threw it clean off-screen. The outside-click handler already
      // lists .pop2 as something that does not dismiss the sheet, so it does
      // not need to be inside it.
      document.body.append(pop2);
      const r = anchor.getBoundingClientRect();
      const w = 290;
      pop2.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`;
      // Above the anchor when there is no room below, so a chip near the
      // bottom of the sheet does not open a popover off-screen.
      const below = innerHeight - r.bottom;
      if (below > 330) pop2.style.top = `${r.bottom + 6}px`;
      else { pop2.style.top = `${Math.max(8, r.top - 330)}px`; }
      pop2.querySelector('input')?.focus();
    }
    function closePop() { pop2.hidden = true; pop2.innerHTML = ''; pop2Ctx = null; }

    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !pop2.hidden) { e.stopImmediatePropagation(); closePop(); }
    }, true);
    document.addEventListener('click', (e) => {
      if (!pop2.hidden && !pop2.contains(e.target)
          && !e.target.closest('[data-tagadd], [data-tagchip]')) closePop();
    });

    /* ---- the picker ------------------------------------------------------- */
    /* One autocomplete, two homes: the tag chip row and the chapter form. It
       is a factory rather than module state because the chapter form has its
       own popover element, and two pickers keyed off the same `pickRows`
       global would answer each other's arrow keys. */
    function makePicker({ input, list, onChoose, exclude = () => false }) {
      let timer = null, rows = [], at = 0, lastFound = [], gen = 0;

      function paint() {
        if (!rows.length) {
          // "Nothing matches" is wrong and confusing when the one thing that
          // matches is already on this stream.
          const attachedHit = lastFound.some(exclude);
          list.innerHTML = `<div class="pop2-empty">${attachedHit
            ? 'Already tagged with that.' : 'Nothing matches, and nothing to create.'}</div>`;
          return;
        }
        list.innerHTML = rows.map((r, i) => r.type === 'mint'
          ? `<div class="pop2-row mint" role="option" data-i="${i}" aria-selected="${i === at}">
               <span class="art">+</span><span class="nm">Create “${esc(r.name)}”</span></div>
             <div class="pop2-kinds">${KINDS.map((k) =>
               `<button data-mintkind="${k}" title="${esc(KIND_GLOSS[k])}"
                 ><i style="background:var(--seg-${k})"></i>${k}</button>`).join('')}
               <span class="pop2-hint">…or just Enter, and file it later.</span></div>`
          : `<div class="pop2-row" role="option" data-i="${i}" aria-selected="${i === at}">
               ${tagArt(r.tag)}
               <span class="nm">${esc(r.tag.name)}
                 ${r.tag.parent ? `<span class="sub">· ${esc(r.tag.parent.name)}</span>` : ''}</span>
               <span class="n">${r.tag.streams}</span></div>`).join('');
        list.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
      }

      async function run(q) {
        const mine = ++gen;
        const typed = q.trim();
        const found = (await api(typed
          ? `/api/tags?q=${encodeURIComponent(typed)}&limit=20`
          : '/api/tags?limit=12')).tags;
        if (mine !== gen) return;          // a later keystroke already answered
        lastFound = found;
        rows = found.filter((t) => !exclude(t)).map((t) => ({ type: 'existing', tag: t }));
        // Minting is the LAST row and always an explicit click. Left implicit —
        // "nothing selected means create" — typing "mario kart" next to an
        // existing "Mario Kart 8 Deluxe" quietly makes a second one, which is
        // exactly how a vocabulary rots.
        const exact = found.some((t) => t.name.toLowerCase() === typed.toLowerCase());
        if (typed && !exact) rows.push({ type: 'mint', name: typed });
        at = 0;
        paint();
      }

      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => run(input.value), 140);
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          at = Math.max(0, Math.min(rows.length - 1, at + (e.key === 'ArrowDown' ? 1 : -1)));
          paint();
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (rows[at]) onChoose(rows[at]);
        }
      });
      list.addEventListener('mousemove', (e) => {
        const row = e.target.closest('.pop2-row'); if (!row) return;
        if (+row.dataset.i !== at) { at = +row.dataset.i; paint(); }
      });
      // stopPropagation, and not optionally: onChoose() may close the popover
      // synchronously, which detaches the clicked row — so by the time the
      // document-level handler runs, closest('.pop2') on a detached node
      // returns null, the sheet's keep-open check misses, and the sheet you
      // were editing closes underneath you.
      list.addEventListener('click', (e) => {
        e.stopPropagation();
        const mk = e.target.closest('[data-mintkind]');
        if (mk) {
          const mint = rows.find((r) => r.type === 'mint');
          if (mint) return void onChoose({ ...mint, kindPick: mk.dataset.mintkind });
        }
        const row = e.target.closest('.pop2-row');
        if (row) return void onChoose(rows[+row.dataset.i]);
      });

      run('');
      return { refresh: () => run(input.value) };
    }

    function openTagPicker(anchor, streamId, attached) {
      openPop(anchor, `
        <input type="text" placeholder="Search or name a tag…" autocomplete="off" spellcheck="false">
        <div class="pop2-list"><div class="pop2-empty">Type to search the archive's vocabulary.</div></div>`,
        { kind: 'pick' });
      const on = new Set(attached.map((t) => t.id));
      makePicker({
        input: pop2.querySelector('input'),
        list: pop2.querySelector('.pop2-list'),
        exclude: (t) => on.has(t.id),
        onChoose: (pick) => { closePop(); attachTag(streamId, pick); },
      });
    }

    async function attachTag(streamId, pick) {
      const link = ulid26();
      if (pick.type === 'existing') {
        await submit([
          { target_type: 'stream_tag', target_id: link, op: 'create', field: 'stream_id', value: streamId },
          { target_type: 'stream_tag', target_id: link, op: 'create', field: 'tag_id', value: pick.tag.id },
        ], `tagged ${pick.tag.name}`, { after: refreshOpenViews });
      } else {
        // Mint and attach in ONE changeset: if the review rejects it, no
        // orphan tag is left behind in everyone's vocabulary.
        const tid = ulid26();
        await submit([
          { target_type: 'tag', target_id: tid, op: 'create', field: 'name', value: pick.name },
          // 'unknown' unless the person clicked one of the four. Minting
          // everything as 'game' was a guess dressed up as a default.
          { target_type: 'tag', target_id: tid, op: 'create', field: 'kind',
            value: pick.kindPick ?? 'unknown' },
          { target_type: 'stream_tag', target_id: link, op: 'create', field: 'stream_id', value: streamId },
          { target_type: 'stream_tag', target_id: link, op: 'create', field: 'tag_id', value: tid },
        ], `added ${pick.name}`, { after: refreshOpenViews });
      }
    }

    /* ---- the editor --------------------------------------------------------
       Two scopes, and they are kept apart on purpose. Detaching removes one
       junction row. Retracting withdraws a thing other streams are using. */
    function openTagEditor(anchor, tag, streamId) {
      const canEdit = !!ME.can?.edit;
      openPop(anchor, `
        <span class="pop2-lab">on this stream</span>
        <div class="pop2-btns">
          <button data-act="detach" class="pop2-danger">Remove from this stream</button>
        </div>
        <div class="pop2-sec">
          <span class="pop2-lab">the tag itself — every stream using it</span>
          <input type="text" data-f="name" value="${esc(tag.name)}" ${canEdit ? '' : 'disabled'}>
          <div class="pop2-btns">
            <select data-f="kind" ${canEdit ? '' : 'disabled'}>
              ${/* 'unknown' is offered only to a tag that already is one, so
                    picking it is never a way to un-file something on purpose —
                    it is just where a freshly minted tag sits until someone
                    says. */
                (tag.kind === 'unknown' || !KINDS.includes(tag.kind)
                  ? ['unknown', ...KINDS] : KINDS)
                .map((k) => `<option value="${k}"${k === tag.kind ? ' selected' : ''}
                  >${k === 'unknown' ? 'not filed yet' : k}</option>`).join('')}
            </select>
            <button data-act="save" class="primary" ${canEdit ? '' : 'disabled'}>Save</button>
          </div>
          ${tag.status === 'proposed' && canEdit
            ? `<div class="pop2-btns"><button data-act="confirm">Confirm — put it in autocomplete</button></div>`
            : ''}
          ${canEdit ? `<div class="pop2-btns"><button data-act="retract" class="pop2-danger">Retract everywhere</button></div>` : ''}
          <div class="pop2-scope">${canEdit
            ? 'Renaming moves its url too. Retracting hides it from every stream that uses it.'
            : 'Only an editor can change the tag itself. You can still remove it from this stream.'}</div>
        </div>`, { kind: 'edit', tag, streamId });
    }

    pop2.addEventListener('click', async (e) => {
      e.stopPropagation();
      const b = e.target.closest('[data-act]');
      if (!b || pop2Ctx?.kind !== 'edit') return;
      const { tag, streamId } = pop2Ctx;
      const name = pop2.querySelector('[data-f="name"]')?.value.trim();
      const kind = pop2.querySelector('[data-f="kind"]')?.value;
      closePop();

      if (b.dataset.act === 'detach') {
        if (!tag.link_id) return void toast('bad', 'Nothing to detach', 'This tag is not attached here.');
        return void await submit([
          { target_type: 'stream_tag', target_id: tag.link_id, op: 'delete' }],
          `removed ${tag.name}`, { after: refreshOpenViews });
      }
      if (b.dataset.act === 'save') {
        const ch = [];
        if (name && name !== tag.name) {
          ch.push({ target_type: 'tag', target_id: tag.id, op: 'update', field: 'name', value: name });
        }
        if (kind && kind !== tag.kind) {
          ch.push({ target_type: 'tag', target_id: tag.id, op: 'update', field: 'kind', value: kind });
        }
        if (!ch.length) return void toast('queued', 'Nothing changed', null, 2500);
        return void await submit(ch, `edited ${tag.name}`, { after: refreshOpenViews });
      }
      if (b.dataset.act === 'confirm') {
        return void await submit([
          { target_type: 'tag', target_id: tag.id, op: 'update', field: 'status', value: 'confirmed' }],
          `confirmed ${tag.name}`, { after: refreshOpenViews });
      }
      if (b.dataset.act === 'retract') {
        if (!confirm(`Retract "${tag.name}" from the whole archive?\n\n`
          + 'It disappears from every stream using it and from autocomplete. '
          + 'The row is tombstoned, not deleted, so it can be brought back.')) return;
        return void await submit([
          { target_type: 'tag', target_id: tag.id, op: 'delete' }],
          `retracted ${tag.name}`, { after: refreshOpenViews });
      }
    });

    /* Client-minted ULIDs are what make a create idempotent — retrying a
       flaky submit applies once. Crockford base32, same alphabet as db.js. */
    function ulid26() {
      const A = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
      let t = Date.now(), time = '';
      for (let i = 0; i < 10; i++) { time = A[t % 32] + time; t = Math.floor(t / 32); }
      const r = crypto.getRandomValues(new Uint8Array(16));
      return time + [...r].map((b) => A[b & 31]).join('');
    }

    /* =====================================================================
       Chapters — drawing a block of time on the strip
       =====================================================================
       The same click on the same pixel already means "seek", and a timeline
       that sometimes seeks and sometimes begins an edit is one you stop
       trusting with the mouse. So drawing is an explicit mode: press the
       button, click the in point, click the out point, fill in the form.

       Everything here works in AXIS seconds — the strip's own coordinate — and
       writes frame='stream'. A chapter is a claim about the broadcast, not
       about whichever file happened to be playing when someone drew it. */

    let drawOn = false;      // the mode
    let drawA = null;        // the in point, once it is down
    let drawWin = null;      // { lo, hi } — the gap the block has to fit inside
    let chap = null;         // the open form's state

    const SNAP_PX = 9;       // how close counts as "on it"

    const realSegs = (exceptId) => (thS?.segments || [])
      .filter((s) => !s.synthetic && s.id && s.id !== exceptId);

    const drawCan = () => !!(ME.can?.suggest && domainOf(thS));

    function drawSetMode(on) {
      drawOn = !!on && drawCan();
      drawA = null; drawWin = null;
      TH.tlbody.classList.toggle('drawing', drawOn);
      TH.ghost.hidden = true;
      TH.mark.hidden = true;
      TH.hair.classList.remove('snapped');
      TH.bubble.classList.remove('on');
      TH.drawBtn.setAttribute('aria-pressed', drawOn ? 'true' : 'false');
      TH.drawBtn.textContent = drawOn ? 'click the start' : '+ chapter';
      if (!drawOn) return;
      // Measured, not hand-summed. The ghost has to sit exactly on the track,
      // and adding up the rows above it in CSS is the same arithmetic that
      // pushed the whole timeline out of the sheet the first time.
      TH.ghost.style.top = TH.track.offsetTop + 'px';
      TH.ghost.style.height = TH.track.offsetHeight + 'px';
    }

    function axisAt(e) {
      const D = domainOf(thS);
      const r = TH.tlbody.getBoundingClientRect();
      return { D, r, t: Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1) * D };
    }

    const segName = (s) => s.label || s.tag?.name || KIND_LABEL[s.kind] || 'block';

    /* Snapping is what makes "the next chapter starts where the last one ended"
       a click rather than a typing exercise. Boundaries of existing blocks, the
       two ends of the stream, and the playhead — the places a human actually
       means. Hold Alt to land exactly where the cursor is instead. */
    function snapTargets(exceptId) {
      const D = domainOf(thS);
      const out = [{ t: 0, why: 'the start' }, { t: D, why: 'the end' }];
      for (const s of realSegs(exceptId)) {
        out.push({ t: s.start_s, why: `start of ${segName(s)}` },
                 { t: s.end_s, why: `end of ${segName(s)}` });
      }
      if (thPlay && Number.isFinite(thAxis)) out.push({ t: thAxis, why: 'the playhead' });
      return out;
    }

    function snapTo(t, widthPx, exceptId) {
      const D = domainOf(thS);
      const radius = (SNAP_PX / Math.max(widthPx, 1)) * D;
      let best = null;
      for (const c of snapTargets(exceptId)) {
        if (c.t === null || c.t === undefined) continue;
        const d = Math.abs(c.t - t);
        if (d <= radius && (!best || d < best.d)) best = { t: c.t, why: c.why, d };
      }
      return best ? { t: Math.round(best.t), why: best.why }
                  : { t: Math.round(t), why: null };
    }

    /* The gap a new block can occupy around `t`, or null if `t` is already
       inside one. The server refuses overlaps outright — checked on the final
       state, in the transaction — so catching it here is not belt and braces,
       it is the difference between a clamp and a 409. */
    function freeWindow(t, exceptId) {
      const D = domainOf(thS);
      let lo = 0, hi = D;
      for (const s of realSegs(exceptId)) {
        if (s.end_s <= t) lo = Math.max(lo, s.end_s);
        else if (s.start_s >= t) hi = Math.min(hi, s.start_s);
        else return null;
      }
      return { lo, hi };
    }

    /** Returns true when the event was drawing's, so the seek handler stands
     *  down. Called from the top of the existing pointermove/click handlers
     *  rather than as a second listener — two listeners on one element racing
     *  over whether a click was a seek is how you get a timeline that jumps. */
    function drawPointerMove(e) {
      if (!drawOn || chap) return drawOn;
      const { D, r, t } = axisAt(e);
      const sn = e.altKey ? { t: Math.round(t), why: null } : snapTo(t, r.width);
      const at = drawA === null ? sn.t
        : Math.min(Math.max(sn.t, drawWin.lo), drawWin.hi);
      const px = (at / D) * r.width;

      TH.hair.style.left = px + 'px';
      TH.hair.classList.toggle('snapped', !!sn.why && at === sn.t);
      TH.bubble.style.left = Math.min(Math.max(px, 70), Math.max(r.width - 70, 70)) + 'px';
      TH.bubble.textContent = sn.why && at === sn.t
        ? `${thHms(at)} · ${sn.why}` : thHms(at);
      TH.bubble.classList.add('on');

      if (drawA !== null) {
        const lo = Math.min(drawA, at), hi = Math.max(drawA, at);
        TH.ghost.hidden = false;
        TH.ghost.style.left = thPct(lo) + '%';
        TH.ghost.style.width = Math.max(thPct(hi) - thPct(lo), 0) + '%';
        TH.ghost.querySelector('b').textContent = hi - lo >= 1 ? thHms(hi - lo) : '';
      }
      return true;
    }

    function drawClick(e) {
      if (!drawOn) return false;
      if (chap) {
        // A proposal is a starting position, not a decision — clicking
        // somewhere else is how you say "not there". A form you built by hand,
        // or one you have started typing into, is not thrown away by a stray
        // click on the strip behind it.
        if (!chap.proposed) return true;
        closeChapter({ keepMode: true });
      }
      const { D, r, t } = axisAt(e);
      const sn = e.altKey ? { t: Math.round(t), why: null } : snapTo(t, r.width);

      if (drawA === null) {
        // Clicking a block that is already there opens it rather than
        // refusing. Otherwise a one-second mistake is permanent-looking.
        const hit = realSegs().find((s) => t >= s.start_s && t < s.end_s);
        if (hit) { openChapter({ mode: 'edit', seg: hit }); return true; }
        const w = freeWindow(sn.t);
        if (!w || w.hi - w.lo < 1) {
          toast('bad', 'No room here', 'This stretch is already covered.', 4000);
          return true;
        }
        drawA = sn.t; drawWin = w;
        TH.mark.hidden = false;
        TH.mark.style.left = thPct(drawA) + '%';
        TH.drawBtn.textContent = 'click the end';
        return true;
      }

      const b = Math.min(Math.max(sn.t, drawWin.lo), drawWin.hi);
      if (Math.abs(b - drawA) < 1) {
        toast('bad', 'Too short',
          'The end has to be at least a second past the start.', 4000);
        return true;
      }
      openChapter({ mode: 'new', a: Math.min(drawA, b), b: Math.max(drawA, b) });
      return true;
    }

    /* ---- the form ----------------------------------------------------------
       Its own element, not the tag popover's: the autocomplete lives INSIDE
       this one, and a single shared popover cannot be both the thing being
       filled in and the list being picked from. It carries .pop2 so it wears
       the same skin and the sheet's keep-open list already knows it. */
    const pop3 = Object.assign(document.createElement('div'),
      { className: 'pop2 pop3', hidden: true });
    document.body.append(pop3);

    const parseHms = (v) => {
      const s = String(v ?? '').trim();
      if (/^\d+$/.test(s)) return +s;
      const m = s.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2})$/);
      return m ? (+(m[1] || 0)) * 3600 + (+m[2]) * 60 + (+m[3]) : null;
    };
    // Always h:mm:ss in the inputs, even under an hour: thHms() drops the hour
    // for display, and a field reading "5:30" that you meant as five and a half
    // hours is a four-hour chapter typed by accident.
    const inHms = (t) => {
      const s = Math.max(0, Math.round(t || 0));
      return `${Math.floor(s / 3600)}:${pad2(Math.floor(s % 3600 / 60))}:${pad2(s % 60)}`;
    };

    /* Pressing the button proposes the block you were almost certainly about to
       draw: from wherever the last chapter ended — or 0 — up to the playhead.
       Two clicks and a drag replaced by nothing at all, and it is only a
       proposal: clicking a different in point or typing over the fields
       replaces it outright. Nothing is written until Accept, same as before.

       It stays quiet when there is nothing obvious to propose — playhead at
       zero, or parked inside a chapter that already exists — rather than
       opening a form full of numbers nobody asked for. */
    function proposeChapter() {
      const D = domainOf(thS);
      const at = Math.round(Number.isFinite(thAxis) ? thAxis : 0);
      if (!D || at <= 0) return;
      const w = freeWindow(at);
      if (!w || at - w.lo < 1) return;
      openChapter({ mode: 'new', a: w.lo, b: Math.min(at, w.hi), proposed: true });
    }

    function openChapter(o) {
      const seg = o.seg ?? null;
      chap = {
        mode: o.mode,
        proposed: !!o.proposed,
        seg,
        id: seg?.id ?? null,
        a: seg ? seg.start_s : o.a,
        b: seg ? seg.end_s : o.b,
        tag: seg?.tag ?? null,
        mint: null,
        kind: seg && seg.kind !== 'unknown' ? seg.kind : null,
        // A block measured inside a capture stores capture-relative numbers,
        // and the strip is showing them converted onto the axis. Writing an
        // axis number back into start_s would move it — quietly, by exactly
        // the recording lag. Those two fields are read-only here, and say so.
        locked: !!(seg && seg.frame !== 'stream'),
      };

      pop3.innerHTML = `
        <span class="pop2-lab">${chap.mode === 'edit' ? 'this chapter' : 'new chapter'}</span>
        <div class="ch-times">
          <label>in<input data-f="in" autocomplete="off" spellcheck="false"
            ${chap.locked ? 'disabled' : ''}></label>
          <label>out<input data-f="out" autocomplete="off" spellcheck="false"
            ${chap.locked ? 'disabled' : ''}></label>
          <span class="ch-dur"></span>
        </div>
        ${chap.locked ? `<div class="ch-hint">Anchored to a capture, so its times
          are measured inside that file. Editing them here would shift the block
          by the recording lag.</div>` : ''}
        <div class="pop2-sec">
          <span class="pop2-lab">what is this block</span>
          <div class="ch-tag" data-ch-tag hidden></div>
          <div data-ch-search>
            <input type="text" data-f="q" placeholder="Search or name a tag…"
              autocomplete="off" spellcheck="false">
            <div class="pop2-list"></div>
          </div>
          <span class="pop2-lab" style="margin-top:8px">kind</span>
          <div class="pop2-kinds" data-ch-kinds>${KINDS.map((k) =>
            `<button data-chkind="${k}" title="${esc(KIND_GLOSS[k])}"
              ><i style="background:var(--seg-${k})"></i>${k}</button>`).join('')}</div>
        </div>
        <div class="ch-err"></div>
        <div class="pop2-btns">
          <button data-ch="cancel">Cancel</button>
          ${chap.mode === 'edit'
            ? '<button data-ch="remove" class="pop2-danger">Remove</button>' : ''}
          <button data-ch="ok" class="primary">${
            chap.mode === 'edit' ? 'Save' : 'Add chapter'}</button>
        </div>`;

      const fIn = pop3.querySelector('[data-f="in"]');
      const fOut = pop3.querySelector('[data-f="out"]');
      fIn.value = inHms(chap.a);
      fOut.value = inHms(chap.b);
      fIn.addEventListener('input', syncChapter);
      fOut.addEventListener('input', syncChapter);
      // Typing "1179" is allowed and means 1179 seconds. Leaving the field
      // still reading "1179" is not: the two fields have to be comparable at a
      // glance, and 1179 next to 0:34:59 is not.
      for (const f of [fIn, fOut]) {
        f.addEventListener('blur', () => {
          const v = parseHms(f.value);
          if (v !== null) f.value = inHms(v);
          syncChapter();
        });
      }

      makePicker({
        input: pop3.querySelector('[data-f="q"]'),
        list: pop3.querySelector('.pop2-list'),
        onChoose: (pick) => {
          if (pick.type === 'existing') {
            chap.tag = pick.tag; chap.mint = null;
            // The tag's category becomes the block's, unless the person has
            // already overridden it. COPIED, not read through: re-filing a game
            // later must not repaint forty old strips.
            if (pick.tag.kind && pick.tag.kind !== 'unknown') chap.kind = pick.tag.kind;
          } else {
            chap.mint = pick.name; chap.tag = null;
            if (pick.kindPick) chap.kind = pick.kindPick;
          }
          syncChapter();
        },
      });

      syncChapter();
      pop3.hidden = false;
      placeChapter();
      pop3.querySelector('[data-f="q"]')?.focus();
      if (chap.proposed) TH.drawBtn.textContent = 'click to redraw';
    }

    // Any touch on the form means these numbers are now the person's, not the
    // proposal's, and a stray click on the strip must stop discarding them.
    for (const ev of ['input', 'pointerdown']) {
      pop3.addEventListener(ev, () => { if (chap) chap.proposed = false; }, true);
    }

    /* Anchored by its BOTTOM edge, not its top. The autocomplete's first page
       arrives from the network a moment after the form opens, so a top-anchored
       popover is measured while it is still short and then grows off the bottom
       of the screen, taking the Accept button with it. Growing upward from a
       fixed bottom cannot do that. */
    function placeChapter() {
      const D = domainOf(thS);
      const r = TH.tlbody.getBoundingClientRect();
      const mid = r.left + ((chap.a + chap.b) / 2 / D) * r.width;
      const w = pop3.offsetWidth || 330;
      pop3.style.left = Math.max(8, Math.min(mid - w / 2, innerWidth - w - 8)) + 'px';
      pop3.style.top = 'auto';
      pop3.style.bottom = Math.max(8, innerHeight - r.top + 12) + 'px';
      pop3.style.maxHeight = Math.max(200, r.top - 20) + 'px';
      pop3.style.overflowY = 'auto';
    }

    /** What is wrong with the form as it stands, in words, or null. */
    function chapterProblem() {
      const D = domainOf(thS);
      const a = parseHms(pop3.querySelector('[data-f="in"]').value);
      const b = parseHms(pop3.querySelector('[data-f="out"]').value);
      if (a === null || b === null) return 'Times read h:mm:ss, m:ss, or plain seconds.';
      if (a < 0 || b > D) return `Outside this stream — it runs 0:00:00 to ${inHms(D)}.`;
      if (b <= a) return 'The end has to come after the start.';
      for (const s of realSegs(chap.id)) {
        if (a < s.end_s && b > s.start_s) {
          return `Overlaps ${segName(s)} (${thHms(s.start_s)}–${thHms(s.end_s)}).`;
        }
      }
      if (!chap.kind) return 'Pick a tag, or say what kind of block this is.';
      return null;
    }

    /* Repaints the parts that depend on state, and nothing else — rebuilding
       the whole form would blow away the autocomplete's listeners and the
       caret in whichever field is being typed into. */
    function syncChapter() {
      if (!chap) return;
      const a = parseHms(pop3.querySelector('[data-f="in"]').value);
      const b = parseHms(pop3.querySelector('[data-f="out"]').value);
      pop3.querySelector('.ch-dur').textContent =
        a !== null && b !== null && b > a ? thHms(b - a) : '—';

      const slot = pop3.querySelector('[data-ch-tag]');
      const search = pop3.querySelector('[data-ch-search]');
      const chosen = chap.tag
        ? { name: chap.tag.name, thumb: chap.tag.thumb, mint: false }
        : chap.mint ? { name: chap.mint, thumb: null, mint: true } : null;
      slot.hidden = !chosen;
      search.hidden = !!chosen;
      if (chosen) {
        slot.innerHTML = `${tagArt(chosen)}<span class="nm">${esc(chosen.name)}${
          chosen.mint ? ' <span class="sub">· new tag</span>' : ''}</span>
          <button data-ch="untag" title="Choose a different tag">×</button>`;
      }

      for (const btn of pop3.querySelectorAll('[data-chkind]')) {
        btn.setAttribute('aria-pressed', btn.dataset.chkind === chap.kind ? 'true' : 'false');
      }

      // Draw the pending block on the strip while the form is open, so the
      // numbers in the fields and the shape on the timeline are the same thing.
      if (a !== null && b !== null && b > a) {
        TH.ghost.hidden = false;
        TH.ghost.style.left = thPct(a) + '%';
        TH.ghost.style.width = Math.max(thPct(b) - thPct(a), 0) + '%';
        TH.ghost.querySelector('b').textContent = thHms(b - a);
      }

      const problem = chapterProblem();
      pop3.querySelector('.ch-err').textContent = problem ?? '';
      pop3.querySelector('[data-ch="ok"]').disabled = !!problem;
    }

    function closeChapter({ keepMode = false } = {}) {
      pop3.hidden = true;
      pop3.innerHTML = '';
      chap = null;
      // Cancel puts you back at "click the start" rather than dropping the
      // mode, because the usual reason to cancel is that you drew it wrong.
      if (keepMode && drawOn) drawSetMode(true);
      else drawSetMode(false);
    }

    async function chapterSave() {
      if (chapterProblem()) return void syncChapter();
      const a = parseHms(pop3.querySelector('[data-f="in"]').value);
      const b = parseHms(pop3.querySelector('[data-f="out"]').value);
      const { mode, id, seg, locked } = chap;
      const changes = [];

      let tagId = chap.tag?.id ?? null;
      if (chap.mint) {
        // Minted in the SAME changeset as the block. If a reviewer says no, no
        // orphan tag is left sitting in everyone's autocomplete.
        tagId = ulid26();
        changes.push(
          { target_type: 'tag', target_id: tagId, op: 'create', field: 'name', value: chap.mint },
          { target_type: 'tag', target_id: tagId, op: 'create', field: 'kind', value: chap.kind });
      }

      if (mode === 'new') {
        const sid = ulid26();
        changes.push(
          { target_type: 'segment', target_id: sid, op: 'create', field: 'stream_id', value: thS.id },
          // 'stream', not 'capture'. This was drawn on the archive's axis, and
          // that is what a chapter is a claim about. Anchoring it to whichever
          // file was playing would move it the day that file's clock is
          // corrected — a silent shift, from a click that never named a file.
          { target_type: 'segment', target_id: sid, op: 'create', field: 'frame', value: 'stream' },
          { target_type: 'segment', target_id: sid, op: 'create', field: 'start_s', value: a },
          { target_type: 'segment', target_id: sid, op: 'create', field: 'end_s', value: b },
          { target_type: 'segment', target_id: sid, op: 'create', field: 'kind', value: chap.kind });
        if (tagId) {
          changes.push({ target_type: 'segment', target_id: sid, op: 'create',
                         field: 'tag_id', value: tagId });
        }
      } else {
        const up = (field, value) => changes.push(
          { target_type: 'segment', target_id: id, op: 'update', field, value });
        if (!locked) {
          if (a !== seg.start_s) up('start_s', a);
          if (b !== seg.end_s) up('end_s', b);
        }
        if (chap.kind !== seg.kind) up('kind', chap.kind);
        if ((tagId ?? null) !== (seg.tag?.id ?? null)) up('tag_id', tagId);
        if (!changes.length) {
          closeChapter();
          return void toast('queued', 'Nothing changed', null, 2500);
        }
      }

      closeChapter();
      await submit(changes, mode === 'edit' ? 'edited a chapter' : 'added a chapter',
        { after: refreshOpenViews });
    }

    pop3.addEventListener('click', async (e) => {
      // The sheet closes on any click that is not inside something it knows
      // about, and closeChapter() detaches whatever was clicked before that
      // check runs. Same trap as the tag popover, same fix.
      e.stopPropagation();
      const k = e.target.closest('[data-chkind]');
      if (k) { chap.kind = chap.kind === k.dataset.chkind ? null : k.dataset.chkind;
               return void syncChapter(); }
      const b = e.target.closest('[data-ch]');
      if (!b) return;
      if (b.dataset.ch === 'untag') { chap.tag = null; chap.mint = null; return void syncChapter(); }
      if (b.dataset.ch === 'cancel') return void closeChapter({ keepMode: true });
      if (b.dataset.ch === 'ok') return void await chapterSave();
      if (b.dataset.ch === 'remove') {
        const { id } = chap;
        closeChapter();
        await submit([{ target_type: 'segment', target_id: id, op: 'delete' }],
          'removed a chapter', { after: refreshOpenViews });
      }
    });

    pop3.addEventListener('keydown', (e) => {
      // Enter in a time field commits; Enter in the search box belongs to the
      // autocomplete, which already handles it.
      if (e.key !== 'Enter' || e.target.matches('[data-f="q"]')) return;
      e.preventDefault();
      if (!chapterProblem()) chapterSave();
    });

    document.addEventListener('click', (e) => {
      if (pop3.hidden) return;
      if (pop3.contains(e.target) || e.target.closest('#th-tlbody, #th-draw')) return;
      closeChapter({ keepMode: true });
    });

    // Escape walks out one layer at a time, and drawing is a layer. Registered
    // in capture so it lands before the theater's own Escape, which is guarded
    // against both of these states for the same reason.
    addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (!pop3.hidden) { e.stopImmediatePropagation(); closeChapter({ keepMode: true }); }
      else if (drawOn) { e.stopImmediatePropagation(); drawSetMode(false); }
    }, true);

    TH.drawBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!pop3.hidden) return void closeChapter();
      if (drawOn) return void drawSetMode(false);
      drawSetMode(true);
      proposeChapter();
    });
    addEventListener('resize', () => { if (!pop3.hidden) placeChapter(); });

    /* =====================================================================
       Notes — the line, the clock, and the box
       =====================================================================
       A note's number is meaningless without saying which clock it was read
       off. All 915 imported notes say "unknown", which is honest and useless:
       the archive can draw them but cannot convert them. This is the control
       that fixes that, one note at a time, and it is the reason the clock model
       exists at all. */

    /** The clocks this stream actually has, as pickable options. */
    function clockOptions(s) {
      const out = [{ key: 'unset', label: 'not recorded', cls: 'unset', ok: true,
                     why: 'Nobody wrote down which clock this number came from' }];
      for (const w of (s?.sources || [])) {
        out.push({
          key: `${w.capture_id}:${w.clock}`,
          capture_id: w.capture_id, clock: w.clock,
          label: w.kind === 'local' ? `local ${w.platform}` : w.kind,
          cls: w.kind === 'local' ? 'local' : w.platform === 'YT' ? 'yt' : 'tw',
          // covers_s is null when that clock has never been measured. A note
          // anchored to it could not be placed on the axis at all, so it is
          // offered greyed rather than accepted and then refused at draw time.
          ok: w.covers_s !== null,
          off: w.covers_s ? w.covers_s[0] : null,
          why: w.covers_s ? `Measured inside the ${w.kind === 'local' ? 'recording' : w.kind} itself`
            : 'This clock has never been measured, so nothing can convert through it',
        });
      }
      out.push({ key: 'axis', label: 'the timeline', cls: 'axis', ok: true, off: 0,
                 why: "Seconds since the stream's own zero, not any one player" });
      return out;
    }

    const noteClockKey = (n) => (n.frame === 'capture' && n.anchor_id)
      ? `${n.anchor_id}:${n.anchor_clock || 'remote'}`
      : n.frame === 'stream' ? 'axis' : 'unset';

    function clockClass(n) {
      const k = noteClockKey(n);
      return clockOptions(thS).find((o) => o.key === k)?.cls ?? 'unset';
    }
    function clockName(n) {
      const k = noteClockKey(n);
      return clockOptions(thS).find((o) => o.key === k)?.label ?? 'an unknown clock';
    }

    /* ---- the editor ------------------------------------------------------ */
    const pop4 = Object.assign(document.createElement('div'),
      { className: 'pop2 pop4', hidden: true });
    document.body.append(pop4);
    let nte = null;      // { id | null, note, clock }

    function openNote(anchor, note) {
      const opts = clockOptions(thS);
      const isNew = !note;
      nte = {
        id: note?.id ?? null,
        note: note ?? null,
        // A new note is measured on whatever is playing, because that is what
        // you were looking at when you wrote it. Shown, never assumed silently.
        clock: isNew ? (thSrc ? `${thSrc.capture_id}:${thSrc.clock}` : 'unset')
                     : noteClockKey(note),
      };
      pop4.innerHTML = `
        <span class="pop2-lab">${isNew ? 'new note' : 'note'}</span>
        <input type="text" data-f="line" autocomplete="off" spellcheck="false"
          placeholder="#short 01 what happened (01:23:45)">
        <div class="nte-read"></div>
        ${note?.raw ? `<div class="nte-raw" title="The line this was imported from. Never edited."
          >imported as <code>${esc(note.raw.trim())}</code></div>` : ''}
        <div class="ch-err"></div>
        <div class="pop2-btns">
          <button data-nt="cancel">Cancel</button>
          ${isNew ? '' : '<button data-nt="del" class="pop2-danger">Delete</button>'}
          <button data-nt="ok" class="primary">${isNew ? 'Add note' : 'Save'}</button>
        </div>`;

      const f = pop4.querySelector('[data-f="line"]');
      f.value = isNew ? '' : noteLine(note);
      f.addEventListener('input', () => {
        // !playhead expands the moment it is complete, so the number appears
        // under your cursor instead of at some later invisible moment.
        if (/!playhead\b/i.test(f.value) && Number.isFinite(thAxis)) {
          const at = f.selectionStart;
          f.value = noteLine(parseNoteLine(f.value, { playheadS: Math.round(thAxis) }));
          f.setSelectionRange(Math.min(at, f.value.length), Math.min(at, f.value.length));
        }
        syncNote();
      });
      pop4.hidden = false;
      syncNote();
      placeNote(anchor);
      f.focus();
      // Caret at the end to keep typing, but scrolled to the start: a long note
      // that opens showing its last forty characters looks like the wrong note.
      f.setSelectionRange(f.value.length, f.value.length);
      f.scrollLeft = 0;
      if (isNew) f.setSelectionRange(0, 0);
    }

    /* Whichever side of the row has more room. Anchoring it above by default
       put the Save button below the fold on any note near the top of the
       panel — a form you have to scroll to submit is a form people abandon. */
    function placeNote(anchor) {
      const r = anchor.getBoundingClientRect();
      const w = pop4.offsetWidth || 340;
      const h = pop4.offsetHeight || 260;
      pop4.style.left = Math.max(8, Math.min(r.left - w + r.width, innerWidth - w - 8)) + 'px';
      const above = r.top - 16, below = innerHeight - r.bottom - 16;
      if (below >= h || below >= above) {
        pop4.style.bottom = 'auto';
        pop4.style.top = Math.max(8, r.bottom + 8) + 'px';
        pop4.style.maxHeight = Math.max(180, below) + 'px';
      } else {
        pop4.style.top = 'auto';
        pop4.style.bottom = Math.max(8, innerHeight - r.top + 8) + 'px';
        pop4.style.maxHeight = Math.max(180, above) + 'px';
      }
      pop4.style.overflowY = 'auto';
    }

    function closeNote() { pop4.hidden = true; pop4.innerHTML = ''; nte = null; }

    /** The parse, shown back. Nothing about splitting a line into four columns
     *  should ever be a surprise, and the axis position is shown next to the
     *  typed one whenever the clock makes them differ. */
    function syncNote() {
      if (!nte) return;
      const line = pop4.querySelector('[data-f="line"]').value;
      const p = parseNoteLine(line);
      const opts = clockOptions(thS);
      const opt = opts.find((o) => o.key === nte.clock) ?? opts[0];
      const stamp = p.stamp || (p.offset_s === null ? null : sToStamp(p.offset_s));

      const bits = [];
      if (p.tag) bits.push(`<b class="nte-tag">#${esc(p.tag)}</b>`);
      if (p.seq !== null) bits.push(`<b class="nte-seq">${String(p.seq).padStart(2, '0')}</b>`);
      if (p.text) bits.push(`<span class="nte-text">${esc(p.text)}</span>`);
      else bits.push('<span class="nte-none">no text</span>');

      let clockRow = '';
      if (stamp !== null) {
        // Only the FIRST point is the marker; the rest is carried, not read.
        const extra = p.stamp ? p.stamp.replace(/^[^\s]+/, '').trim() : '';
        const axis = opt.off === null || opt.off === undefined ? null : p.offset_s + opt.off;
        clockRow = `<div class="nte-clock">
          <button class="nte-dot ${opt.cls}" data-nt="clock" aria-expanded="false"
            title="${esc(opt.why)}"></button>
          <b>${esc(sToStamp(p.offset_s))}</b>
          <span>on ${esc(opt.label)}</span>
          ${extra ? `<span class="nte-extra" title="Carried, not read — a note is a pin, not an interval">${esc(extra)}</span>` : ''}
          ${axis !== null && axis !== p.offset_s
            ? `<span class="nte-axis">→ ${esc(sToStamp(axis))} on the timeline</span>` : ''}
          <span class="nte-caret">▾</span></div>
          <div class="nte-list" hidden>${opts.map((o) => `
            <button data-clock="${esc(o.key)}" ${o.ok ? '' : 'disabled'}
              aria-selected="${o.key === nte.clock}" title="${esc(o.why)}">
              <i class="nte-dot ${o.cls}"></i>${esc(o.label)}${o.ok ? '' : ' — never measured'}
            </button>`).join('')}</div>`;
      }
      pop4.querySelector('.nte-read').innerHTML = bits.join('<span class="nte-sep">·</span>') + clockRow;

      const problem = !p.text && p.offset_s === null
        ? 'A note needs something in it — text, a timestamp, or both.' : null;
      pop4.querySelector('.ch-err').textContent = problem ?? '';
      pop4.querySelector('[data-nt="ok"]').disabled = !!problem;
    }

    async function noteSave() {
      const line = pop4.querySelector('[data-f="line"]').value;
      const p = parseNoteLine(line);
      if (!p.text && p.offset_s === null) return void syncNote();
      const opt = clockOptions(thS).find((o) => o.key === nte.clock) ?? { key: 'unset' };
      // Only an instrument may claim a second. A clock says WHICH number this
      // is, and once it does the number is exact on that clock — which is the
      // whole point: a timestamp copied off the YouTube player is exact on
      // YouTube's clock and nowhere else.
      const clockFields = opt.key === 'unset'
        ? { frame: 'unknown', anchor_id: null, anchor_clock: null, offset_precision_s: null }
        : opt.key === 'axis'
          ? { frame: 'stream', anchor_id: null, anchor_clock: null, offset_precision_s: 1 }
          : { frame: 'capture', anchor_id: opt.capture_id, anchor_clock: opt.clock,
              offset_precision_s: 1 };
      const want = { tag: p.tag, seq: p.seq, text: p.text, offset_s: p.offset_s,
                     stamp: p.stamp, ...clockFields };
      const { id, note } = nte;
      closeNote();

      if (!id) {
        const nid = ulid26();
        const ord = Math.max(0, ...(thS.notes || []).map((x) => x.ord ?? 0)) + 1;
        const ch = [
          { target_type: 'note', target_id: nid, op: 'create', field: 'stream_id', value: thS.id },
          { target_type: 'note', target_id: nid, op: 'create', field: 'ord', value: ord },
          // lore and asset are records of a fact, not work, so they arrive
          // already ticked. Everything else starts as something to do.
          { target_type: 'note', target_id: nid, op: 'create', field: 'done',
            value: NOTE_DONE_ON_CREATE.has(want.tag) ? 1 : 0 },
        ];
        for (const [k, v] of Object.entries(want)) {
          if (v !== null && v !== undefined) {
            ch.push({ target_type: 'note', target_id: nid, op: 'create', field: k, value: v });
          }
        }
        if (!want.text) ch.push({ target_type: 'note', target_id: nid, op: 'create', field: 'text', value: '' });
        return void await submit(ch, 'added a note', { after: refreshOpenViews });
      }

      const now0 = { tag: note.tag ?? null, seq: note.seq ?? null, text: note.text ?? '',
                     offset_s: note.offset_s ?? null, stamp: note.stamp ?? null,
                     frame: note.frame ?? 'unknown', anchor_id: note.anchor_id ?? null,
                     anchor_clock: note.anchor_clock ?? null,
                     offset_precision_s: note.precision_s ?? null };
      const ch = [];
      for (const [k, v] of Object.entries(want)) {
        if (String(v ?? '') === String(now0[k] ?? '')) continue;
        ch.push({ target_type: 'note', target_id: id, op: 'update', field: k, value: v });
      }
      if (!ch.length) return void toast('queued', 'Nothing changed', null, 2500);
      await submit(ch, 'edited a note', { after: refreshOpenViews });
    }

    pop4.addEventListener('click', async (e) => {
      // closeNote() detaches the clicked node, and the page's outside-click
      // check then reads it as "not in the sheet". Same trap, same fix.
      e.stopPropagation();
      const pick = e.target.closest('[data-clock]');
      if (pick) { nte.clock = pick.dataset.clock; return void syncNote(); }
      const b = e.target.closest('[data-nt]');
      if (!b) return;
      if (b.dataset.nt === 'clock') {
        const list = pop4.querySelector('.nte-list');
        list.hidden = !list.hidden;
        b.setAttribute('aria-expanded', list.hidden ? 'false' : 'true');
        return;
      }
      if (b.dataset.nt === 'cancel') return void closeNote();
      if (b.dataset.nt === 'ok') return void await noteSave();
      if (b.dataset.nt === 'del') {
        const { id, note } = nte;
        closeNote();
        await submit([{ target_type: 'note', target_id: id, op: 'delete' }],
          `removed "${(note.text || 'a note').slice(0, 40)}"`, { after: refreshOpenViews });
      }
    });

    pop4.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      noteSave();
    });

    document.addEventListener('click', (e) => {
      if (pop4.hidden) return;
      if (pop4.contains(e.target) || e.target.closest('[data-ntedit]')) return;
      closeNote();
    });
    addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !pop4.hidden) { e.stopImmediatePropagation(); closeNote(); }
    }, true);

    /* ---- the box, on both surfaces --------------------------------------- */
    async function toggleDone(id, next, label) {
      await submit([{ target_type: 'note', target_id: id, op: 'update',
                      field: 'done', value: next ? 1 : 0 }],
        next ? `ticked off ${label}` : `un-ticked ${label}`, { after: refreshOpenViews });
    }

    function noteClicks(root, find) {
      root.addEventListener('click', (e) => {
        const box = e.target.closest('[data-ntdone]');
        if (box) {
          e.stopPropagation();
          const n = find(box.dataset.ntdone);
          const on = box.getAttribute('aria-pressed') === 'true';
          return void toggleDone(box.dataset.ntdone, !on,
            `"${((n?.text) || 'a note').slice(0, 32)}"`);
        }
      });
      /* Double-click, not a pencil. A single click on a note already seeks to
         it, and a pencil that only appears on hover is a target you have to go
         looking for on every row. The rounded outline says the row is editable
         to anyone who can edit; everyone else sees a plain row. */
      root.addEventListener('dblclick', (e) => {
        const row = e.target.closest('[data-ntedit]');
        if (!row) return;
        e.preventDefault();
        e.stopPropagation();
        // A double-click is two clicks, and the first one seeked. Put it back.
        if (seekBefore !== null) { thSeek(seekBefore); seekBefore = null; }
        const n = find(row.dataset.ntedit);
        if (n) openNote(row, n);
      });
      root.addEventListener('mousedown', (e) => {
        if (e.detail === 1 && e.target.closest('[data-ntedit]')) {
          seekBefore = Number.isFinite(thAxis) ? thAxis : null;
        }
      });
    }
    let seekBefore = null;
    noteClicks(TH.notes, (id) => (thS?.notes || []).find((n) => n.id === id));
    noteClicks(notesCard, (id) => (selectedVod?.notes || []).find((n) => n.id === id));

    /* ---- the add-a-note field -------------------------------------------
       Enter writes the line. One gesture, and the same grammar the editor
       parses, so there is nothing new to learn and nothing to open first.

       The theater's field knows the playhead, so !playhead expands there. The
       index card's does not, and a note written there lands frame='unknown' —
       a number with nobody's word on which clock it came from. That is the
       honest state, and the theater is where you name it. */
    async function addNoteFrom(input, streamId, { notes = [], src = null } = {}) {
      const line = input.value.trim();
      if (!line) return;
      const at = src && Number.isFinite(thAxis) ? Math.round(thAxis) : null;
      const p = parseNoteLine(line, { playheadS: at });
      if (!p.text && p.offset_s === null) {
        return void toast('bad', 'Nothing to save',
          'A note needs text, a timestamp, or both.', 4000);
      }
      const nid = ulid26();
      const ord = Math.max(0, ...notes.map((x) => x.ord ?? 0)) + 1;
      const ch = [
        { target_type: 'note', target_id: nid, op: 'create', field: 'stream_id', value: streamId },
        { target_type: 'note', target_id: nid, op: 'create', field: 'ord', value: ord },
        { target_type: 'note', target_id: nid, op: 'create', field: 'text', value: p.text },
        { target_type: 'note', target_id: nid, op: 'create', field: 'done',
          value: NOTE_DONE_ON_CREATE.has(p.tag) ? 1 : 0 },
      ];
      if (p.tag) ch.push({ target_type: 'note', target_id: nid, op: 'create', field: 'tag', value: p.tag });
      if (p.seq !== null) ch.push({ target_type: 'note', target_id: nid, op: 'create', field: 'seq', value: p.seq });
      if (p.stamp) ch.push({ target_type: 'note', target_id: nid, op: 'create', field: 'stamp', value: p.stamp });
      if (p.offset_s !== null) {
        ch.push({ target_type: 'note', target_id: nid, op: 'create', field: 'offset_s', value: p.offset_s });
        // A clock is only claimed where one is actually on screen. No source,
        // no anchor — and never an anchor on a note with no number to anchor.
        if (src) {
          ch.push(
            { target_type: 'note', target_id: nid, op: 'create', field: 'frame', value: 'capture' },
            { target_type: 'note', target_id: nid, op: 'create', field: 'anchor_id', value: src.capture_id },
            { target_type: 'note', target_id: nid, op: 'create', field: 'anchor_clock', value: src.clock },
            { target_type: 'note', target_id: nid, op: 'create', field: 'offset_precision_s', value: 1 });
        }
      }
      input.value = '';
      input.disabled = true;
      await submit(ch, `noted "${(p.text || sToStamp(p.offset_s)).slice(0, 40)}"`,
        { after: refreshOpenViews });
      input.disabled = false;
    }

    function bindNoteField(root, get) {
      root.addEventListener('keydown', (e) => {
        const f = e.target.closest('[data-notenew]');
        if (!f || e.key !== 'Enter') return;
        e.preventDefault();
        e.stopPropagation();
        addNoteFrom(f, f.dataset.notenew, get());
      });
    }
    bindNoteField(TH.notes, () => ({ notes: thS?.notes ?? [], src: thSrc }));
    bindNoteField(notesCard, () => ({ notes: selectedVod?.notes ?? [], src: null }));

    /* =====================================================================
       Inline editing — one table, one handler, two surfaces
       =====================================================================
       Every editable thing on the sheet and in the theater is the same
       mechanism: an element carrying data-edit="<field>", a hover outline that
       appears only if you may write, and a double-click that turns it into an
       input in place. Enter or blur saves, Escape cancels.

       One table because there are fourteen of these across two views, and
       fourteen bespoke editors is fourteen places for the same validation bug.
       Double-click and not single, because most of these elements are already
       something you click — the title opens nothing, but the tag chips open a
       picker and the timestamps seek. */

    const INLINE = {
      idx: {
        label: 'stream number', hint: 'The number from the .md files.',
        write: 'idx', width: 90,
        get: (s) => (s.idx === null || s.idx === undefined ? '' : String(s.idx)),
        parse: (v) => {
          const t = v.trim().replace(/^#/, '');
          if (!t) return { value: null };
          if (!/^\d{1,6}$/.test(t)) return { error: 'A whole number, or empty.' };
          return { value: Number(t) };
        },
      },
      title: {
        label: 'title', write: 'title', wide: true,
        get: (s) => s.title ?? '',
        parse: (v) => (v.trim() ? { value: v.trim() } : { error: 'A stream needs a title.' }),
      },
      when: {
        label: 'started', write: 'started_at', width: 170,
        hint: 'Local time. Only this field moves — notes and chapters keep the numbers they were given.',
        get: (s) => `${s.date} ${hhmm(s.start_sod ?? 0)}`,
        parse: (v, s) => {
          const m = v.trim().match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?$/);
          if (!m) return { error: 'YYYY-MM-DD HH:MM' };
          const [, y, mo, d, hh, mi, ss] = m;
          // The stored column is UTC; the display is local. local_date and
          // start_sod are generated from started_at + tz_offset_min*60, so the
          // inverse is exactly this subtraction and nothing else.
          const localEpoch = Date.UTC(+y, +mo - 1, +d, +hh, +mi, +(ss || 0)) / 1000;
          return { value: Math.round(localEpoch - (s.tz_offset_min ?? 0) * 60) };
        },
      },
      duration: {
        label: 'length', write: 'duration_s', width: 110,
        hint: 'h:mm:ss, m:ss, or plain seconds. Empty means nobody has measured it.',
        get: (s) => (s.duration_s === null || s.duration_s === undefined
          ? '' : sToStamp(s.duration_s)),
        parse: (v) => {
          if (!v.trim()) return { value: null };
          const n = parseHms(v);
          return n === null ? { error: 'h:mm:ss, m:ss, or plain seconds.' } : { value: n };
        },
      },
      thumb: {
        label: 'thumbnail', write: 'thumb_path', wide: true,
        hint: 'A path under the media root. Empty falls back to the capture’s own '
          + 'thumbnail, then to YouTube’s.',
        get: (s) => s.thumb_path ?? '',
        parse: (v) => ({ value: v.trim() || null }),
      },
      summary: {
        label: 'summary', write: 'summary', textarea: true,
        get: (s) => s.summary ?? '',
        parse: (v) => ({ value: v.trim() || null }),
      },
      serve: {
        label: 'default source', write: 'serve_pref', width: 130,
        hint: 'Which platform the watch chain leads with. Empty means the usual order.',
        get: (s) => s.serve_pref ?? '',
        parse: (v) => {
          const t = v.trim().toUpperCase();
          if (!t) return { value: null };
          return ['YT', 'TW'].includes(t) ? { value: t } : { error: 'YT, TW, or empty.' };
        },
      },
    };

    // Capture fields, edited from the same machinery with a different target.
    const INLINE_CAP = {
      url: { label: 'url', write: 'url', wide: true, get: (c) => c.url ?? '',
             parse: (v) => ({ value: v.trim() || null }) },
      remote_id: { label: 'remote id', write: 'remote_id', width: 150,
                   get: (c) => c.remote_id ?? '', parse: (v) => ({ value: v.trim() || null }) },
      video_path: { label: 'video path', write: 'video_path', wide: true,
                    get: (c) => c.video_path ?? '', parse: (v) => ({ value: v.trim() || null }) },
      chat_path: { label: 'chat path', write: 'chat_path', wide: true,
                   get: (c) => c.chat_path ?? '', parse: (v) => ({ value: v.trim() || null }) },
      mirror_url: { label: 'mirror url', write: 'mirror_url', wide: true,
                    get: (c) => c.mirror_url ?? '', parse: (v) => ({ value: v.trim() || null }) },
    };

    let editing = null;   // { el, spec, rec, kind } while an input is open

    const canEdit = () => !!ME.can?.suggest;

    /** Mark up a value as editable. Everything double-clickable goes through
     *  this so the affordance and the hook cannot drift apart. */
    function ed(field, html, { tag = 'span', cls = '', target = null, title = '' } = {}) {
      if (!canEdit()) return `<${tag} class="${cls}"${title ? ` title="${esc(title)}"` : ''}>${html}</${tag}>`;
      const spec = (target ? INLINE_CAP : INLINE)[field];
      return `<${tag} class="${cls} editable" data-edit="${esc(field)}"${
        target ? ` data-edit-target="${esc(target)}"` : ''
        } title="${esc(title ? title + ' — ' : '')}double-click to edit${
        spec?.hint ? ' · ' + spec.hint : ''}">${html}</${tag}>`;
    }

    function closeInline({ restore = true } = {}) {
      if (!editing) return;
      const { el, html } = editing;
      editing = null;
      if (restore && el.isConnected) { el.innerHTML = html; el.classList.remove('editing'); }
    }
