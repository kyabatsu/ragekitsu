      tab.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); const n = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length; activate(tabs[n], true); } });
    });
    addEventListener('resize', () => moveIndicator(tabs.find(t => t.getAttribute('aria-selected') === 'true')));
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => moveIndicator(tabs[0]));

    /* ===== Icons ===== */
    const imgIcon = '<span class="glyph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="m21 16-5-5L5 21"/></svg></span>';
    const playIcon = '<span class="glyph"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';

    /* ===== Data (swap for real records) ===== */
    const imageItems = [
      {id:'i1',gif:false,tags:['tenma_maemi','smile','solo','1girl']},
      {id:'i2',gif:false,tags:['tenma_maemi','wink','close-up']},
      {id:'i3',gif:true,tags:['tenma_maemi','dance','animated']},
      {id:'i4',gif:false,tags:['tenma_maemi','pout','reaction']},
      {id:'i5',gif:true,tags:['tenma_maemi','wave','animated','greeting']},
      {id:'i6',gif:false,tags:['tenma_maemi','laugh']},
      {id:'i7',gif:false,tags:['tenma_maemi','thumbs_up','solo']},
      {id:'i8',gif:true,tags:['tenma_maemi','spin','animated']},
      {id:'i9',gif:false,tags:['tenma_maemi','surprised']},
      {id:'i10',gif:false,tags:['tenma_maemi','sticker','chibi']},
      {id:'i11',gif:true,tags:['tenma_maemi','headpat','animated']},
      {id:'i12',gif:false,tags:['tenma_maemi','peace_sign']}
    ];
    const clipItems = [
      {id:'c1',title:'"that\'s crazy" reaction',duration:'0:06',tags:['reaction','deadpan']},
      {id:'c2',title:'surprised pikachu moment',duration:'0:11',tags:['reaction','meme']},
      {id:'c3',title:'deadpan stare',duration:'0:04',tags:['reaction','silence']},
      {id:'c4',title:'unexpected scream',duration:'0:08',tags:['reaction','jumpscare']}
    ];
    /* Those two lists are still demo data — nothing in the API backs Snippets
       or Image assets yet. Everything below is live. */
    const imageMap = Object.fromEntries(imageItems.map(x => [x.id, x]));
    const clipMap = Object.fromEntries(clipItems.map(x => [x.id, x]));

    const gi = document.getElementById('grid-images');
    imageItems.forEach(it => gi.insertAdjacentHTML('beforeend',
      `<div class="tile ph item" data-id="${it.id}" data-type="image" role="button" tabindex="0" aria-label="Open image">${it.gif ? '<span class="tag-corner pill accent">GIF</span>' : ''}${imgIcon}</div>`));

    const ls = document.getElementById('list-snippets');
    clipItems.forEach(it => ls.insertAdjacentHTML('beforeend',
      `<div class="clip item" data-id="${it.id}" data-type="clip" role="button" tabindex="0" aria-label="Open clip"><div class="thumb ph">${playIcon}</div>
       <div class="body"><div class="title">${it.title}</div><div class="sub"><span class="pill">${it.duration}</span>${it.tags.map(t => `<span class="pill">${t}</span>`).join('')}</div></div></div>`));

    /* =====================================================================
       API
       ===================================================================== */

    /* Every value that reaches innerHTML goes through this. The mockup could
       interpolate raw because it owned its own strings; real titles and notes
       are user text, and one apostrophe in title="..." is enough to break the
       markup even before anyone tries anything hostile. */
    const ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESCAPES[c]);

    const banner = document.createElement('div');
    banner.className = 'banner';
    banner.hidden = true;
    document.getElementById('panel-index').prepend(banner);

    function offline(e) {
      banner.hidden = false;
      banner.textContent = `Can't reach the archive API — ${e.message}. `
        + `Is the server running on ${location.origin}?`;
      console.error(e);
    }
    const online = () => { banner.hidden = true; };

    async function api(path) {
      // `cache: 'no-cache'` means revalidate, not "don't cache". The server
      // sends Cache-Control: max-age=15, so without this the browser answers
      // the refetch after a write from its own cache and the page shows the
      // pre-edit state for fifteen seconds — you tag something, the toast says
      // applied, and nothing appears. Revalidating still gets a 304 from the
      // generation ETag whenever nothing has actually changed, so the whole
      // point of that ETag survives; only the staleness goes.
      const r = await fetch(path, { headers: { accept: 'application/json' },
                                    cache: 'no-cache' });
      if (!r.ok) throw new Error(`${r.status} on ${path}`);
      online();
      return r.json();
    }

    /* The archive's vocabulary is about evidence, the calendar's is about
       colour. present/lost/never/unverified answers "what do we know"; the dot
       only has four states. A stream that has not aired yet is scheduled no
       matter what the column says. */
    const STATE = { present: 'live', partial: 'live', unverified: 'unknown',
                    never: 'missed', lost: 'missed' };
    const mapState = (v, startedAt) =>
      (startedAt * 1000 > Date.now() ? 'scheduled' : (STATE[v] ?? 'unknown'));

    const hhmm = sod => pad2(Math.floor(sod / 3600)) + ':' + pad2(Math.floor(sod % 3600 / 60));

    /* One pill, not two. A date and a clock time are one fact — when it went
       live — and splitting them into adjacent boxes makes the eye do a join it
       should never have been asked to do. */
    const whenPill = (date, time) =>
      `<span class="pill">${esc(date ?? '—')}${time ? ' ' + esc(time) : ''}</span>`;

    /* `vod: present` spends four characters saying "present" and reads like a
       field dump. A mark does it in one — but only three marks, not two:
       "recorded once and the file is gone" and "never captured at all" are
       different claims, and the theater already gives `never` its own tombstone
       copy on the strength of that difference. Flattening them here would make
       the pill and the tombstone disagree. The word itself lives in the title,
       so nothing is actually lost, only folded. */
    const STATE_MARK = { present: '✔', lost: '✗', never: '—' };
    const STATE_TONE = { present: 'ok', lost: 'gone', never: 'none' };
    const STATE_WHY = {
      vod: { present: 'A copy is on record',
             lost: 'It was recorded once — the file is gone',
             never: 'Nothing was ever captured',
             unverified: 'No media root is set, so nothing has checked' },
      chat: { present: 'A chat log is on record',
              lost: 'It was recorded once — the file is gone',
              never: 'No chat was ever captured',
              unverified: 'No media root is set, so nothing has checked' },
    };
    /* ── the note line ────────────────────────────────────────────────────
       A note is one line of text, and four columns fall out of it:

         #short 01 Tenma eats a cake (00:12:16 - 00:13:27)
          └tag┘ └id┘ └──── text ────┘ └────── stamp ──────┘

       Only the FIRST point of a stamp is the marker — a note is a pin, never an
       interval. `-` means a span and `;` means two moments, so the expression is
       kept verbatim rather than reduced to a second number that would have to
       lie about one of them.

       Strict on purpose. A trailing paren group is a timestamp only if it
       matches exactly; "(sent to me)" — a real note in this archive — stays
       text, and so does a half-typed number, and so does the leading bare stamp
       the vault used on about half its lines. Guessing at input that is nearly
       a timestamp is how one silently becomes the wrong number. The line is
       always rebuilt from the stored columns, never re-read from `raw`: the
       importer already did that parse, and `raw` stays the untouched receipt. */
    const NT_POINT = String.raw`\d{1,2}:\d{2}(?::\d{2})?`;
    const NT_STAMP = new RegExp(String.raw`\((\s*${NT_POINT}\s*(?:[-–;]\s*${NT_POINT}\s*)?)\)\s*$`);
    const NT_HEAD = new RegExp(String.raw`^#([\p{L}\p{N}_-]+)(?:\s+(\d{1,3})(?=\s|$))?\s*`, 'u');
    // The vault wrote #srt for what is a short. Accepted on the way in, never
    // shown on the way out — one word for one thing.
    const NT_ALIAS = { srt: 'short' };

    const stampToS = (t) => {
      const p = t.trim().split(':').map(Number);
      return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p[0] * 60 + p[1];
    };
    const sToStamp = (s) => {
      const v = Math.max(0, Math.round(s));
      return `${pad2(Math.floor(v / 3600))}:${pad2(Math.floor(v % 3600 / 60))}:${pad2(v % 60)}`;
    };

    /** stored columns -> the one line a human edits. */
    function noteLine(n) {
      const stamp = n.stamp
        || (n.offset_s === null || n.offset_s === undefined ? null : sToStamp(n.offset_s));
      return [
        n.tag ? '#' + n.tag : null,
        n.seq === null || n.seq === undefined ? null : String(n.seq).padStart(2, '0'),
        n.text || null,
        stamp ? `(${stamp})` : null,
      ].filter(Boolean).join(' ');
    }

    /** the line -> stored columns. `playheadS` expands the !playhead token. */
    function parseNoteLine(line, { playheadS = null } = {}) {
      let s = String(line ?? '').trim();
      // !playhead is expanded before anything else looks at the line, so it
      // behaves exactly as if the number had been typed — including replacing
      // a stamp that is already there rather than leaving two.
      if (playheadS !== null && /!playhead\b/i.test(s)) {
        s = s.replace(/\s*!playhead\b/gi, '').replace(NT_STAMP, '').trim();
        s += ` (${sToStamp(playheadS)})`;
      }
      let stamp = null, offset = null;
      const m = s.match(NT_STAMP);
      if (m) {
        stamp = m[1].trim().replace(/\s*[-–]\s*/, ' - ').replace(/\s*;\s*/, '; ');
        offset = stampToS(stamp.match(new RegExp(NT_POINT))[0]);
        s = s.slice(0, m.index).trim();
        // A plain single point needs no column of its own: offset_s already
        // holds it, and the line is rebuilt from that.
        if (stamp === sToStamp(offset)) stamp = null;
      }
      let tag = null, seq = null;
      const h = s.match(NT_HEAD);
      if (h) {
        const raw = h[1].toLowerCase();
        tag = NT_ALIAS[raw] ?? raw;
        seq = h[2] === undefined ? null : Number(h[2]);
        s = s.slice(h[0].length);
      }
      return { tag, seq, text: s.trim(), offset_s: offset, stamp };
    }

    /* A checkbox is a task, and not every note is one. `lore` and `asset` are
       records of a fact — there is nothing to do, so they arrive already ticked.
       `short` and `clip` are work. An untagged note is an observation and gets
       no box at all: three of the archive's 433 untagged notes have ever been
       ticked, which is noise, and those three keep their box rather than having
       a stored fact hidden from them. */
    const NOTE_DONE_ON_CREATE = new Set(['lore', 'asset']);
    const noteHasBox = (n) => !!n.tag || !!(n.done ?? n.d);

    /* Grouped by what a note is FOR, not by when it happened. This list is a
       work queue before it is a transcript, and the work batches by kind: you
       cut every clip in one sitting, not one clip per hour of stream.
       Chronological survives INSIDE each group, because the server already
       orders by offset and the sort below is stable.

       Anything tagged with a word that is not on this list sorts after the
       planned ones and before untagged — it is still a category, just not one
       anybody planned for, and burying it with the untagged notes would hide
       that somebody invented a word. */
    const NOTE_ORDER = ['asset', 'lore', 'meme', 'short', 'clip'];
    const NOTE_GROUP = { '': 'untagged' };

    function sortNotes(notes) {
      const rank = (n) => {
        if (!n.tag) return NOTE_ORDER.length + 1;
        const i = NOTE_ORDER.indexOf(n.tag);
        return i === -1 ? NOTE_ORDER.length : i;
      };
      return (notes ?? []).map((n, i) => [n, i]).sort(
        (a, b) => rank(a[0]) - rank(b[0])
          || (a[0].tag ?? '').localeCompare(b[0].tag ?? '')
          || a[1] - b[1],
      ).map(([n]) => n);
    }

    /** Walk a sorted list, emitting a header the first time each tag appears. */
    function groupedNotes(notes, header, row) {
      let last;
      return sortNotes(notes).map((n) => {
        const tag = n.tag ?? '';
        const head = tag === last ? '' : header(NOTE_GROUP[tag] ?? tag);
        last = tag;
        return head + row(n);
      }).join('');
    }

    /* The same three-way distinction as the pill, drawn instead of spelled. Grey
       is "never captured", the accent is "on record", and the warm red is the
       one that matters — it existed once and the file is gone. A two-state
       icon would collapse those last two, and the theater gives `never` its own
       tombstone copy on the strength of the difference. */
    const STATE_ICON = {
      vod: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
        + 'stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"/>'
        + '<path d="m22 7-6 4 6 4V7Z"/></svg>',
      chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
        + 'stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>',
    };
    const stateIcon = (what, state) =>
      `<i class="st-ico ${esc(STATE_TONE[state] ?? 'none')}" title="${esc(what)}: ${
        esc(STATE_WHY[what]?.[state] ?? `state is "${state ?? 'unknown'}"`)}"
        role="img" aria-label="${esc(what)}: ${esc(state ?? 'unknown')}">${STATE_ICON[what]}</i>`;

    const statePill = (what, state) =>
      `<span class="pill" title="${esc(what)}: ${esc(STATE_WHY[what]?.[state]
        ?? `state is "${state ?? 'unknown'}"`)}">${esc(what)} <b class="mk ${
        STATE_TONE[state] ?? 'none'}">${STATE_MARK[state] ?? '?'}</b></span>`;
    const hmsShort = t => {
      const s = Math.max(0, Math.round(t));
      return `${Math.floor(s / 3600)}h${Math.floor(s % 3600 / 60)}m${s % 60}s`;
    };
    /* Stable hue per stream so a screen of placeholders reads as distinct
       cards. Same id always gives the same colour. */
    const hueOf = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

    /* API stream -> the shape the view code already speaks. Everything the
       mockup invented (day, time, dur, game, vod, chat) is derived here, so
       renderCalendar/cardHtml/popRow below stay as they were written. */
    function adapt(s) {
      return {
        id: s.id,
        idx: s.idx,
        day: Number(s.date.slice(8, 10)),
        time: hhmm(s.start_sod ?? 0),
        title: s.title || '(untitled)',
        game: (s.tags.find(t => t.kind === 'game') || {}).name || null,
        tags: s.tags || [],
        tagRows: s.tags || [],       // the full entities, for the chips
        dur: (s.duration_s || 0) / 3600,
        duration: s.duration || '—',
        // The raw values the inline editor writes back, alongside the strings
        // it displays. Editing a field means round-tripping the number, not
        // re-parsing the pretty version of it.
        duration_s: s.duration_s ?? null,
        start_sod: s.start_sod ?? null,
        tz_offset_min: s.tz_offset_min ?? 0,
        thumb_path: s.thumb_path ?? null,
        thumb_source: s.thumb_source ?? null,
        serve_pref: s.serve_pref ?? null,
        // Only the detail endpoint carries these; the month list does not, and
        // the sheet's strip renders nothing rather than guessing a shape.
        axis: s.axis ?? null,
        segments: s.segments ?? [],
        date: s.date,
        month: s.month,
        started_at: s.started_at,
        vod: mapState(s.vod_state, s.started_at),
        chat: mapState(s.chat_state, s.started_at),
        vodStatus: s.vod_state,
        chatStatus: s.chat_state,
        summary: s.summary,
        thumb: s.thumb,
        watch: s.watch || [],
        captures: s.captures || [],
        notes: (s.notes || []).map(n => ({
          id: n.id, d: n.done ? 1 : 0, tag: n.tag, text: n.text,
          ts: n.at, at: n.broadcast_offset_s, link: n.link, approx: n.approx,
          // Whether anybody ever said which clock this number came from. The
          // card cannot name the clock, but it can say that nobody has.
          exact: !!n.exact, frame: n.frame ?? 'unknown',
        })),
      };
    }

    let MONTH_INDEX = [];                 // [{month:'2026-08', streams, seconds}]
    const monthCache = new Map();         // 'YYYY-MM' -> adapted[]
    let ME = { role: 'viewer', can: {} }; // read by the editing slice, later

    async function loadMonth(key) {
      if (monthCache.has(key)) return monthCache.get(key);
      const j = await api(`/api/streams?month=${key}&include=notes&limit=100`);
      const list = j.streams.map(adapt);
      monthCache.set(key, list);
      return list;
    }

    /* =====================================================================
       Calendar
       ===================================================================== */
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const calGrid = document.getElementById('cal-grid'), calTitle = document.getElementById('cal-title');
    const calMain = document.getElementById('cal-main'), pop = document.getElementById('cal-pop');
    const popDate = document.getElementById('pop-date'), popSub = document.getElementById('pop-sub'), popList = document.getElementById('pop-list');
    const now = new Date();
    let viewY = now.getFullYear(), viewM = now.getMonth(), selectedDay = null;
    let calList = [];                       // this month's streams, never filtered
    const pad2 = n => String(n).padStart(2, '0');
    const monthKey = (y = viewY, m = viewM) => `${y}-${pad2(m + 1)}`;

    /* --- ring: 24h clock, midnight at top, clockwise --- */
    const frac = t => { const [h, m] = t.split(':').map(Number); return (h * 60 + m) / 1440; };
    function segmentsFor(list) {
      const out = [];
      list.forEach(s => {
        const a = frac(s.time), b = a + (s.dur || 2) / 24;
        if (b <= 1) out.push([a, b]);
        else { out.push([a, 1]); out.push([0, b - 1]); }   // wrap past midnight
      });
      return out;
    }
    function buildGradient(segments) {
      if (!segments.length) return 'none';
      const merged = [];
      segments.slice().sort((x, y) => x[0] - y[0]).forEach(seg => {
        const last = merged[merged.length - 1];
        if (last && seg[0] <= last[1]) last[1] = Math.max(last[1], seg[1]);
        else merged.push([seg[0], seg[1]]);
      });
      const stops = []; let cursor = 0;
      merged.forEach(([start, end]) => {
        const s = start * 360, e = end * 360;
        if (s > cursor) stops.push(`transparent ${cursor}deg`, `transparent ${s}deg`);
        stops.push(`var(--air) ${s}deg`, `var(--air) ${e}deg`);
        cursor = e;
      });
      if (cursor < 360) stops.push(`transparent ${cursor}deg`, `transparent 360deg`);
      return `conic-gradient(from 0deg at 50% 50%, ${stops.join(', ')})`;
    }

    /* --- status: worst case across the day's streams wins the dot --- */
    const DOT = { live: 'dot--live', missed: 'dot--missed', unknown: 'dot--unknown', scheduled: 'dot--scheduled' };
    const RANK = { live: 0, scheduled: 1, unknown: 2, missed: 3 };
    const worst = (list, key) => list.reduce((acc, s) => (RANK[s[key]] > RANK[acc] ? s[key] : acc), 'live');

    function renderCalendar() {
      calTitle.textContent = MONTHS[viewM] + ' ' + viewY;
      const offset = (new Date(viewY, viewM, 1).getDay() + 6) % 7;
      const days = new Date(viewY, viewM + 1, 0).getDate();
      const byDay = {};
      calList.forEach(s => (byDay[s.day] = byDay[s.day] || []).push(s));
      const isNow = now.getFullYear() === viewY && now.getMonth() === viewM;
      let html = '';
      for (let i = 0; i < offset; i++) html += '<span class="cal-cell cal-empty"></span>';
      for (let d = 1; d <= days; d++) {
        const list = byDay[d];
        let c = 'cal-cell';
        if (list) c += ' streamed';
        if (d === selectedDay) c += ' selected';
        if (isNow && d === now.getDate()) c += ' today';
        let attrs = '', dots = '';
        if (list) {
          const hrs = list.reduce((n, s) => n + (s.dur || 2), 0).toFixed(1);
          attrs = ` data-day="${d}" role="button" tabindex="0" aria-label="${list.length} stream${list.length > 1 ? 's' : ''}, ${hrs}h on air"`
                + ` style="--seg:${buildGradient(segmentsFor(list))}"`;
          dots = `<span class="cal-dots"><span class="cal-dot ${DOT[worst(list,'vod')]}"></span><span class="cal-dot ${DOT[worst(list,'chat')]}"></span></span>`;
        }
        html += `<span class="${c}"${attrs}><span class="cal-inner"><span class="cal-num">${d}</span>${dots}</span></span>`;
      }
      calGrid.innerHTML = html;
    }

    /* =====================================================================
       Stream list — this month, or the whole archive paged in on scroll
       ===================================================================== */
    const calVods = document.getElementById('cal-vods'), calCount = document.getElementById('cal-stream-count');
    const sentinel = document.getElementById('cal-sentinel');
    const allBtn = document.getElementById('cal-all'), allHint = document.getElementById('cal-all-hint');
    let allMode = false, query = '', shownCount = 0, shownHours = 0;
    let cursor = null, exhausted = false, loading = false, token = 0;
    const vodMap = {};

    function cardHtml(s) {
      const lead = s.watch[0];
      const srcPill = lead
        ? `<span class="pill${lead.kind === 'youtube' ? '' : ' accent'}">${esc(lead.kind)}</span>`
        : '<span class="pill">no source</span>';
      const chatPill = s.chat === 'missed' ? '' : '<span class="pill">CHAT</span>';
      /* The <img> lies on top of the placeholder rather than replacing it, so
         onerror only has to hide itself for the fallback to reappear. */
      const img = s.thumb
        ? `<img src="${esc(s.thumb)}" alt="" loading="lazy" onerror="this.hidden=true">` : '';
      return `<div class="vod item" data-id="${esc(s.id)}" data-type="vod" role="button" tabindex="0" aria-label="Open ${esc(s.title)}">
        <div class="thumb ph" style="--hue:${hueOf(s.id)}">${img}<div class="badges">${chatPill}${srcPill}</div>${s.idx ? `<span class="vod-idx">${pad4(s.idx)}</span>` : ''}${playIcon}</div>
        <div class="body"><div class="title" title="${esc(s.title)}">${esc(s.title)}</div>
          <div class="sub"><span class="meta">${esc(s.date)}</span><span class="pill">${esc(s.duration)}</span>
            ${ME.can?.edit ? `<span class="card-tools">
              <button class="card-tool" data-wrench="${esc(s.id)}" title="Edit this stream and its captures"
                aria-label="Edit this stream and its captures">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3Z"/></svg>
              </button>
              <button class="card-tool danger" data-del="${esc(s.id)}" title="Delete this stream"
                aria-label="Delete this stream">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
              </button></span>` : ''}</div></div></div>`;
    }
    const pad4 = n => String(n).padStart(4, '0');

    function appendStreams(list) {
      if (!list.length) return;
      list.forEach(s => { vodMap[s.id] = s; });
      calVods.insertAdjacentHTML('beforeend', list.map(cardHtml).join(''));
      shownCount += list.length;
      shownHours += list.reduce((n, s) => n + (s.dur || 0), 0);
    }
    function updateCount() {
      const noun = query ? (shownCount === 1 ? 'match' : 'matches') : (shownCount === 1 ? 'stream' : 'streams');
      calCount.textContent = shownCount
        ? `${shownCount} ${noun} · ${shownHours.toFixed(1)}h on air`
        : (loading ? 'loading…' : (query ? 'no matches' : 'nothing recorded'));
      allHint.textContent = allMode ? 'archive' : MONTHS[viewM].slice(0, 3) + ' only';
    }

    /* Keyset, not offset: `next` carries the last row's (started_at, id) so a
       page boundary can't skip or repeat a stream when the archive changes
       underneath a long scroll. */
    async function loadPage() {
      // A month fits in one page; the archive scroll wants small ones.
      const p = new URLSearchParams({ limit: allMode ? '30' : '100', include: 'notes' });
      if (query) p.set('q', query);
      if (!allMode) p.set('month', monthKey());
      if (cursor) { p.set('before', cursor.before); p.set('before_id', cursor.before_id); }
      const j = await api('/api/streams?' + p);
      cursor = j.next;
      exhausted = !j.next;
      return j.streams.map(adapt);
    }

    /* Keeps pulling while the sentinel is near the viewport, so a query that
       empties several pages in a row still resolves in one pass. */
    async function fillWhileVisible() {
      if (loading || exhausted || !allMode) return;
      const mine = token;
      loading = true;
      try {
        let guard = 0;
        while (!exhausted && guard++ < 40 && token === mine
               && sentinel.getBoundingClientRect().top <= innerHeight + 400) {
          const page = await loadPage();
          if (token !== mine) return;
          appendStreams(page);
          updateCount();
          await new Promise(requestAnimationFrame);
        }
        if (exhausted && token === mine) sentinel.textContent = 'Start of archive';
      } catch (e) { offline(e); } finally { if (token === mine) loading = false; }
    }

    async function renderStreams() {
      const mine = ++token;
      calVods.innerHTML = ''; shownCount = 0; shownHours = 0;
      cursor = null; exhausted = false; loading = false;
      for (const k of Object.keys(vodMap)) delete vodMap[k];
      updateCount();
      sentinel.textContent = 'Loading…';
      if (allMode) {
        sentinel.hidden = false;
        await fillWhileVisible();
        return;
      }
      sentinel.hidden = true;
      try {
        /* No query means the calendar's own copy is already the answer — one
           fetch per month, not two. */
        const list = query ? await loadPage() : calList.slice();
        if (mine !== token) return;
        appendStreams(list.slice().sort((a, b) => b.started_at - a.started_at));
        updateCount();
        /* A search that finds nothing in July is indistinguishable from a
           search that finds nothing at all, and the toggle sitting two inches
           away is not an obvious fix. Say which one it was. */
        if (query && !shownCount) {
          const probe = await api('/api/streams?limit=1&q=' + encodeURIComponent(query));
          if (mine !== token || !probe.count) return;
          sentinel.hidden = false;
          sentinel.innerHTML = `Nothing in ${MONTHS[viewM]} — `
            + `<button class="btn-ghost" data-widen>search the whole archive</button>`;
          sentinel.querySelector('[data-widen]').onclick = () => allBtn.click();
        }
      } catch (e) { offline(e); }
    }

    new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) fillWhileVisible(); },
      { rootMargin: '400px' }).observe(sentinel);

    allBtn.addEventListener('click', () => {
      allMode = !allMode;
      allBtn.setAttribute('aria-checked', allMode);
      clearVod(); renderStreams();
    });
    let searchTimer;
    document.getElementById('cal-search').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { query = e.target.value.trim(); clearVod(); renderStreams(); }, 180);
    });

    /* =====================================================================
       Notes
       ===================================================================== */
    const notesCard = document.getElementById('notes-card');
    let selectedVod = null;
    const NOTES_PLACEHOLDER =
      `<div class="notes-empty">
         <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
           <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
           <rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
         <div class="notes-empty-title">No stream selected</div>
         <div class="notes-empty-sub">Pick a stream to pull up its notes and jump between timestamps.</div>
       </div>`;

    /* A timestamp is an anchor, not a button. Left-click seeks the embed when
       one is open; ctrl-click, middle-click and "copy link address" all still
       do the obvious thing because the href is real. */
    function noteRows(rec) {
      const can = !!ME.can?.suggest;
      /* A field, not a button. Adding a note is the most common thing anyone
         will do here, and putting it behind a click that then opens a form is
         two gestures for one line of text. At the END of the list on this card
         because you are reviewing; the theater puts it at the top because you
         are writing while something plays. */
      const add = can ? `<div class="ob-new"><input type="text" data-notenew="${esc(rec.id)}"
          placeholder="Add a note…  #tag 01 text (1:23:45)"
          title="One line: an optional #tag, an optional number, the text, and an optional timestamp in brackets at the end. Enter saves it."
          autocomplete="off" spellcheck="false"></div>` : '';
      if (!rec.notes || !rec.notes.length) {
        return `<div class="pop-empty">No notes on this stream yet.</div>${add}`;
      }
      return groupedNotes(rec.notes,
        (label) => `<div class="ob-group">${esc(label)}</div>`,
        (n) => {
          const cls = 'ob-ts' + (n.approx ? ' approx' : '');
          const ts = !n.ts ? ''
            : n.link
              ? `<a class="${cls}" href="${esc(n.link)}" target="_blank" rel="noopener"
                    data-nid="${esc(n.id)}" data-sid="${esc(rec.id)}"
                    title="Jump to ${esc(n.ts)}">(${esc(n.ts)})</a>`
              : `<span class="${cls}" title="No source to jump to">(${esc(n.ts)})</span>`;
          // The box is a button, not a checkbox input: it writes through a
          // changeset like everything else, and a native input that flips
          // instantly and then maybe queues for review would be lying about
          // what just happened.
          const box = noteHasBox(n)
            ? `<button class="ob-box" data-ntdone="${esc(n.id)}" aria-pressed="${n.d ? 'true' : 'false'}"
                 title="${ME.can?.suggest ? (n.d ? 'Done — click to un-tick' : 'Click to tick off')
                   : 'Sign in to change this'}"${ME.can?.suggest ? '' : ' disabled'}></button>`
            : '<span class="ob-nobox"></span>';
          // Two states here, not the theater's five: this card has no source
          // list to name a clock from, so all it can honestly say is whether
          // anybody ever did.
          const dot = n.ts ? `<i class="ob-clk${n.exact ? ' on' : ''}" title="${n.exact
            ? 'Measured on a clock' : 'Nobody recorded which clock this came from'}"></i>` : '';
          return `<div class="ob-line${can ? ' editable' : ''}" data-nid="${esc(n.id)}"${
            can ? ` data-ntedit="${esc(n.id)}"` : ''}>${box}<span class="ob-check">`
            + `<span class="ob-text${n.d ? ' done' : ''}" title="${esc(n.text)}">${
                esc(n.text) || '<i>no text yet</i>'}</span></span>${dot}${ts}</div>`;
        }) + add;
    }

    function updateNoteCount() {
      const el = notesCard.querySelector('.nb-count'); if (!el || !selectedVod) return;
      el.textContent = `${selectedVod.notes.filter(n => n.d).length}/${selectedVod.notes.length}`;
    }
    function renderNotes() {
      if (!selectedVod) { notesCard.innerHTML = NOTES_PLACEHOLDER; return; }
      const v = selectedVod;
      const done = v.notes.filter(n => n.d).length;
      notesCard.innerHTML =
        `<div class="nb-kicker">${v.idx ? '#' + pad4(v.idx) + ' · ' : ''}${esc(v.date)} · ${esc(v.time)}</div>
         <div class="nb-title">${esc(v.title)}</div>
         ${v.summary ? `<div class="nb-summary">${esc(v.summary)}</div>` : ''}
         <div class="nb-list-head"><span>Notes</span><span class="nb-count">${done}/${v.notes.length}</span></div>
         <div class="nb-list">${noteRows(v)}</div>`;
    }
    function selectVod(id) {
      selectedVod = (id && vodMap[id]) || null;
      calVods.querySelectorAll('.vod').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
      renderNotes();
    }
    function clearVod() { selectVod(null); }

    function bindNotes(container, getRec) {
      container.addEventListener('click', e => {
        const t = e.target.closest('a.ob-ts'); if (!t) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;   // let the browser win
        const rec = getRec(t); if (!rec) return;
        // By id, not index: the list is grouped by tag now, so a position in
        // the DOM is no longer a position in rec.notes.
        const n = rec.notes.find((x) => x.id === t.dataset.nid);
        if (!n) return;
        if (seekTo(rec, n)) e.preventDefault();     // only swallow it if we actually seeked
      });
    }
    bindNotes(notesCard, () => selectedVod);
    bindNotes(popList, el => { const d = el.closest('.pop-item'); return d ? d._rec : null; });

    /* =====================================================================
       Day popover
       ===================================================================== */
    const chevron = '<svg class="pop-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 18 6-6-6-6"/></svg>';
    function popRow(s) {
      return `<details class="pop-item">
        <summary><span class="pop-time">${esc(s.time)}</span><span class="pop-title">${esc(s.title)}</span>
          <span class="pop-status"><span class="cal-dot ${DOT[s.vod]}"></span><span class="cal-dot ${DOT[s.chat]}"></span></span>${chevron}</summary>
        <div class="pop-body">
          <div class="pop-meta">${s.game ? `<span class="pill accent">${esc(s.game)}</span>` : '<span class="pill">zatsudan</span>'}<span class="pill">${s.dur.toFixed(1)}h</span>${statePill('vod', s.vodStatus)}${statePill('chat', s.chatStatus)}</div>
          <div class="pop-summary">${s.summary ? esc(s.summary) : 'No summary written for this stream yet.'}</div>
          <div class="pop-notes"><div class="pop-notes-head">Notes</div>${noteRows(s)}</div>
        </div></details>`;
    }
    function placePop(cell) {
      const host = calMain.getBoundingClientRect(), c = cell.getBoundingClientRect();
      const pw = pop.offsetWidth, ph = pop.offsetHeight;
      let side = 'right', left = c.right - host.left + 12;
      if (c.right + 12 + pw > innerWidth - 16) { side = 'left'; left = c.left - host.left - pw - 12; }
      if (host.left + left < 16) { left = 16 - host.left; }
      let top = c.top - host.top - 12;
      if (host.top + top + ph > innerHeight - 16) top = innerHeight - 16 - ph - host.top;
      if (host.top + top < 80) top = 80 - host.top;
      pop.dataset.side = side;
      pop.style.left = Math.round(left) + 'px';
      pop.style.top = Math.round(top) + 'px';
      const caret = c.top + c.height / 2 - host.top - top;
      pop.style.setProperty('--caret-y', Math.min(Math.max(caret, 16), ph - 16) + 'px');
    }
    function openDay(d) {
      const list = calList.filter(s => s.day === d);
      if (!list.length) return;
      if (selectedDay === d && pop.classList.contains('open')) { closeDay(); return; }
      selectedDay = d; renderCalendar();
      const hrs = list.reduce((n, s) => n + (s.dur || 0), 0).toFixed(1);
      popDate.textContent = new Date(viewY, viewM, d).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
      popSub.textContent = `${list.length} stream${list.length > 1 ? 's' : ''} · ${hrs}h`;
      const ordered = list.slice().sort((a, b) => a.time.localeCompare(b.time));
      popList.innerHTML = ordered.map(popRow).join('');
      Array.from(popList.children).forEach((el, i) => { el._rec = ordered[i]; });
      if (list.length === 1) popList.firstElementChild.open = true;
      pop.hidden = false;
      placePop(calGrid.querySelector(`.cal-cell[data-day="${d}"]`));
      requestAnimationFrame(() => pop.classList.add('open'));
    }
    function closeDay() {
      if (pop.hidden) { selectedDay = null; return; }
      pop.classList.remove('open');
      selectedDay = null; renderCalendar();
      setTimeout(() => { if (!pop.classList.contains('open')) pop.hidden = true; }, 180);
    }
    function reposition() { if (!pop.hidden && selectedDay) { const c = calGrid.querySelector(`.cal-cell[data-day="${selectedDay}"]`); if (c) placePop(c); } }

    calGrid.addEventListener('click', e => { const c = e.target.closest('.cal-cell.streamed'); if (c) openDay(+c.dataset.day); });
    calGrid.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const c = e.target.closest('.cal-cell.streamed'); if (c) { e.preventDefault(); openDay(+c.dataset.day); } } });
    document.getElementById('pop-close').addEventListener('click', closeDay);
    pop.addEventListener('toggle', reposition, true);
    addEventListener('resize', reposition);
    addEventListener('scroll', reposition, { passive: true });

    /* =====================================================================
       Detail sheet + player
       ===================================================================== */
    const sheet = document.getElementById('sheet');
    const sPrev = document.getElementById('sheet-preview'), sMain = document.getElementById('sheet-main');
    const sActs = document.getElementById('sheet-actions');

    /* The page reserves room for the sheet by measuring it, not by a number
       typed once. The sheet has changed height three times now — a strip here,
       a button row there — and each time the constant went stale silently and
       parked the bottom row of cards underneath it. */
    function fitSheet() {
      if (sheet.hidden) return;
      document.body.style.setProperty('--sheet-h', sheet.offsetHeight + 'px');
    }
    addEventListener('resize', fitSheet);
    let currentUrl = '', current = null, srcIdx = 0;

    /* A note's offset is on the broadcast clock — the only frame every source
       agrees on. A player is positioned inside one particular file, which may
       have started late. Subtracting that capture's own offset converts one to
       the other; this is the whole reason capture.offset_s exists. */
    function captureFor(s, w) {
      return (s.captures || []).find(c => c.remote_id === w?.id) || null;
    }
    function embedSrc(s, w, broadcastSeconds) {
      if (!w || !w.embeddable) return null;
      const u = new URL(w.embed);
      const cap = captureFor(s, w);
      const t = broadcastSeconds == null ? null
        : Math.max(0, broadcastSeconds - (cap?.offset_s || 0));
      if (w.kind === 'youtube') {
        u.searchParams.set('rel', '0');
        u.searchParams.set('autoplay', '1');
        if (t) u.searchParams.set('start', String(Math.round(t)));
      } else if (w.kind === 'twitch') {
        // Twitch refuses to frame unless `parent` matches the serving hostname
        // exactly. localhost is accepted; a bare IP like 127.0.0.1 is not.
        u.searchParams.set('parent', location.hostname || 'localhost');
        u.searchParams.set('autoplay', 'true');
        if (t) u.searchParams.set('time', hmsShort(t));
      }
      return u.href;
    }

    function play(s, i, seconds) {
      const w = s.watch[i];
      if (!w) return false;
      if (!w.embeddable) { if (w.url) open(w.url, '_blank', 'noopener'); return false; }
      const src = embedSrc(s, w, seconds);
      if (!src) return false;
      srcIdx = i;
      sPrev.innerHTML = `<iframe src="${esc(src)}" allow="autoplay; fullscreen; encrypted-media"
        allowfullscreen title="${esc(s.title)}"></iframe>`;
      sheet.classList.add('playing');
      requestAnimationFrame(fitSheet);
      sMain.querySelectorAll('.sheet-src button').forEach((b, j) =>
        b.setAttribute('aria-pressed', String(j === i)));
      return true;
    }
    /* Returns true when it actually moved a player, so the caller knows
       whether to swallow the click or let the link open a new tab. */
    function seekTo(rec, n) {
      if (!n || n.at == null) return false;
      if (!current || current.id !== rec.id || !sheet.classList.contains('playing')) return false;
      return play(current, current.watch[srcIdx]?.embeddable ? srcIdx : 0, n.at);
    }

    /* Twitch checks `parent` against the hostname serving the page and rejects
       bare IPs outright. Nothing can be done about it from here, so say so on
       the button rather than letting the player fail silently. */
    const IP_HOST = /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname);
    function srcTitle(w) {
      if (w.kind === 'twitch' && IP_HOST) {
        return `Twitch will refuse to embed on ${location.hostname} — reach this page as localhost instead`;
      }
      if (w.embeddable) return 'Play here';
      return w.url ? 'Opens in a new tab' : 'Local file — nothing serves it yet';
    }
    function sheetHtml(s) {
      const src = s.watch.length
        ? `<div class="sheet-src">${s.watch.map((w, i) =>
            `<button data-src="${i}" aria-pressed="false" title="${esc(srcTitle(w))}"${!w.embeddable && !w.url ? ' disabled' : ''}>${esc(w.kind)}${w.alive === 0 ? ' (dead)' : ''}${w.kind === 'twitch' && IP_HOST ? ' ⚠' : ''}</button>`).join('')}</div>`
        : '<div class="sheet-src"><button disabled>no source on record</button></div>';
      // The kicker's content moved into the meta row and lost the word
      // "Stream" — it sits above a panel titled with a stream, on a page of
      // streams. The number was the only part carrying information.
      return `<div class="sheet-title">${
          ed('title', esc(s.title), { cls: 'sheet-title-t' })}</div>
        <div class="sheet-meta">
          ${ed('idx', s.idx ? '#' + pad4(s.idx) : '#—', { cls: 'pill pill-idx' })}
          ${ed('when', esc(`${s.date} ${s.time}`), { cls: 'pill' })}
          ${ed('duration', esc(s.duration), { cls: 'pill', title: 'How long it ran' })}
          ${stateIcon('vod', s.vodStatus)}${stateIcon('chat', s.chatStatus)}
          ${s.open_changesets ? `<span class="pill accent">${s.open_changesets} open suggestion${s.open_changesets > 1 ? 's' : ''}</span>` : ''}</div>
        ${tagsRowHtml(s.tagRows, s.id)}
        ${src}
        ${summaryHtml(s)}
        ${stripHtml(s)}`;
    }

    /* Every one of the 221 streams has an empty summary, so this is not an edit
       control with an occasional empty state — it is an empty state with an
       occasional edit. It says so, and it is the click target. */
    function summaryHtml(s) {
      const can = !!ME.can?.suggest;
      if (!s.summary) {
        // Nothing to double-click when there is nothing there, so the empty
        // state stays a button. It opens the same editor.
        return can
          ? `<div class="sum">${ed('summary', 'No summary yet — write one',
              { cls: 'sum-t sum-empty' })}</div>`
          : '';
      }
      return `<div class="sum">${ed('summary', esc(s.summary), { cls: 'sum-t' })}</div>`;
    }

    /* The theater's strip, read-only, in the space the older/newer buttons used
       to take. It answers "what is in this stream" before you commit to opening
       it — which is the question the sheet exists to answer, and the one thing
       it could not say. Deliberately inert: editing chapters is a job for the
       page that has a playhead to check them against. */
    function stripHtml(s) {
      const D = s.axis?.domain_s ?? null;
      const segs = s.segments ?? [];
      const hint = `<span class="navhint">← newer · older →</span>`;
      // No domain means no scale, and drawing a strip against a guessed length
      // is the one thing the clock model exists to prevent. Say nothing.
      if (!D || !segs.length) {
        return `<div class="sheet-strip-head"><span>${
          D ? 'no chapters yet' : 'no duration on record'}</span>${hint}</div>`;
      }
      const pct = (x) => Math.max(0, Math.min(100, ((x ?? 0) / D) * 100));
      const named = segs.filter((g) => !g.synthetic).length;
      return `<div class="sheet-strip-head"><span>${
          named ? `${named} chapter${named === 1 ? '' : 's'}` : 'no chapters yet'
        }</span>${hint}</div>
        <div class="sheet-strip" aria-hidden="true">${segs.map((g) => {
          const name = g.label || (g.synthetic ? 'unlabelled' : KIND_LABEL[g.kind] || g.kind);
          return `<i class="${esc(g.kind)}" style="left:${pct(g.start_s)}%;width:${
            Math.max(pct(g.end_s) - pct(g.start_s), 0)}%;${
            g.kind === 'unknown' ? '' : `background:var(--seg-${g.kind});`}"
            title="${esc(name)} · ${esc(thHms(g.start_s))}–${esc(thHms(g.end_s))}"
            ><span>${esc(g.synthetic ? '' : name)}</span></i>`;
        }).join('')}</div>`;
    }

    const linkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>'
      + '<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    const planeIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '
      + 'stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/>'
      + '<path d="M22 2 15 22l-4-9-9-4Z"/></svg>';

    const copyBtn = (label = 'Copy link') =>
      `<button class="btn-ghost sheet-ico" data-act="copy" title="${esc(label)}"
        aria-label="${esc(label)}">${linkIcon}<b>Copied!</b></button>`;
    const openBtn = `<button class="btn-ghost sheet-ico" data-act="open"
        title="Open in a new tab" aria-label="Open in a new tab">${planeIcon}</button>`;

    function sheetActionsHtml(s) {
      return `<button class="btn-primary" data-act="theater"${
        s.watch.length ? '' : ' disabled'}>Watch here</button>${copyBtn()}${openBtn}`;
    }

    function openSheetFor(s) {
      current = s; srcIdx = 0;
      currentUrl = `${location.origin}${location.pathname}#/s/${s.id}`;
      sheet.classList.remove('playing');
      sPrev.className = 'sheet-preview ph ratio-169' + (ME.can?.suggest ? ' editable' : '');
      if (ME.can?.suggest) {
        sPrev.dataset.edit = 'thumb';
        sPrev.title = `Thumbnail — ${s.thumb_path ? 'set by hand' :
          s.thumb_source === 'capture' ? "from the capture's own"
          : s.thumb_source === 'youtube' ? "from YouTube's" : 'none on record'
          } · double-click to edit`;
      } else { delete sPrev.dataset.edit; sPrev.title = ''; }
      sPrev.style.setProperty('--hue', hueOf(s.id));
      sPrev.innerHTML = (s.thumb ? `<img src="${esc(s.thumb)}" alt="" onerror="this.hidden=true">` : '') + playIcon;
      sActs.innerHTML = sheetActionsHtml(s);
      sMain.innerHTML = sheetHtml(s);
      sheet.hidden = false;
      document.body.classList.add('sheet-open');
      requestAnimationFrame(() => { sheet.classList.add('open'); fitSheet(); });
      if (location.hash !== `#/s/${s.id}`) history.replaceState(null, '', `#/s/${s.id}`);
    }

    /* The detail endpoint adds prev/next neighbours and the open-suggestion
       count, which the list projection deliberately does not carry. */
    async function openStream(id) {
      try {
        const raw = await api(`/api/streams/${encodeURIComponent(id)}`);
        const full = adapt(raw);
        full.prev_id = raw.prev_id; full.next_id = raw.next_id;
        full.open_changesets = raw.open_changesets;
        vodMap[full.id] = full;
        selectedVod = full; renderNotes();
        openSheetFor(full);
      } catch (e) { offline(e); }
    }

    const templates = {
      image(it) {
        currentUrl = `${location.origin}/i/${it.id}`;
        sPrev.className = 'sheet-preview ph ratio-1';
        sPrev.innerHTML = `${it.gif ? '<span class="sheet-badge pill accent">GIF</span>' : ''}${imgIcon}`;
        sMain.innerHTML =
          `<div class="sheet-kicker">Image asset</div>
           <div class="sheet-tags">${it.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>
           <div class="sheet-meta"><span class="pill">${it.gif ? 'GIF' : 'PNG'}</span><span class="pill">demo record</span></div>`;
        sActs.innerHTML = copyBtn('Copy link to this asset') + openBtn;
      },
      clip(it) {
        currentUrl = `${location.origin}/c/${it.id}`;
        sPrev.className = 'sheet-preview ph ratio-169';
        sPrev.innerHTML = playIcon;
        sMain.innerHTML =
          `<div class="sheet-kicker">Snippet</div>
           <div class="sheet-title">${esc(it.title)}</div>
           <div class="sheet-meta"><span class="pill">${esc(it.duration)}</span>${it.tags.map(t => `<span class="pill">${esc(t)}</span>`).join('')}</div>`;
        sActs.innerHTML = copyBtn('Copy link to this snippet') + openBtn;
      },
    };

    function openSheet(type, item) {
      current = null;
      sheet.classList.remove('playing');
      templates[type](item);
      sheet.hidden = false;
      document.body.classList.add('sheet-open');
      requestAnimationFrame(() => { sheet.classList.add('open'); fitSheet(); });
    }
    function closeSheet() {
      if (sheet.hidden) return;
      sheet.classList.remove('open', 'playing');
      document.body.classList.remove('sheet-open');
      setTimeout(() => { sheet.hidden = true; sPrev.innerHTML = ''; }, 300);   // kills the iframe
      current = null;
      if (location.hash.startsWith('#/s/')) history.replaceState(null, '', location.pathname);
      clearVod();
    }

    document.getElementById('grid-images').addEventListener('click', e => {
      const el = e.target.closest('.item'); if (el) openSheet('image', imageMap[el.dataset.id]);
    });
    document.getElementById('list-snippets').addEventListener('click', e => {
      const el = e.target.closest('.item'); if (el) openSheet('clip', clipMap[el.dataset.id]);
    });
    /* One handler, two effects: the ring moves to the card and the notes rail
       fills instantly from what the list already had, then the detail fetch
       upgrades it with neighbours and the suggestion count. */
    function pickStream(id) { selectVod(id); openStream(id); }
    calVods.addEventListener('click', e => { const el = e.target.closest('.vod.item'); if (el) pickStream(el.dataset.id); });
    calVods.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const el = e.target.closest('.vod.item'); if (el) { e.preventDefault(); pickStream(el.dataset.id); }
    });
    popList.addEventListener('click', e => {
      const t = e.target.closest('.pop-title'); if (!t) return;
      const d = t.closest('.pop-item'); if (d && d._rec) openStream(d._rec.id);
    });

    document.getElementById('sheet-close').addEventListener('click', closeSheet);
    sheet.addEventListener('click', e => {
      const b = e.target.closest('[data-act], [data-src]'); if (!b) return;
      if (b.dataset.src !== undefined && current) return void play(current, +b.dataset.src, null);
      switch (b.dataset.act) {
        case 'theater': if (current) openTheater(current.id, 0); break;
        case 'watch': if (current) play(current, srcIdx, null); break;
        case 'copy':
          if (navigator.clipboard) navigator.clipboard.writeText(currentUrl).catch(() => {});
          // A class, never innerHTML — see .sheet-ico in the stylesheet. A
          // button that gives no sign it worked is a button people press three
          // times and then distrust.
          b.classList.add('copied');
          setTimeout(() => b.classList.remove('copied'), 1300);
          break;
        case 'open': window.open(currentUrl, '_blank', 'noopener'); break;

      }
    });
    addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeDay(); } });

    /* ← and → step through the archive while the sheet is open, replacing the
       two buttons that used to. Direction follows what is already on screen:
       the grid puts the newest stream top-left and the theater's rail now runs
       newest-leftmost, so LEFT is newer and RIGHT is older everywhere.
       Anything with a text cursor in it keeps its own arrow keys. */
    addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
      if (sheet.hidden || !current) return;
      if (!TH.root.hidden) return;                    // the theater has its own rail
      if (popOpen()) return;                          // a popover owns the keys
      if (document.activeElement?.closest(
        'input, textarea, select, [contenteditable=""], [contenteditable="true"]')) return;
      const id = e.key === 'ArrowLeft' ? current.next_id : current.prev_id;
      if (!id) return;
      e.preventDefault();
      openStream(id);
    });
    /* Where the click STARTED, recorded during capture — before any handler has
       had the chance to replace the node it came from.

       This has now caused three separate bugs: the tag popover, the sheet's
       copy button, and the summary editor. Each replaced its own element inside
       its own click handler, and by the time the check below ran, `e.target`
       was an orphan whose closest('#sheet') is null — so the page concluded the
       click had been outside and closed the very thing being edited. Asking at
       capture time makes that impossible, rather than making every new control
       remember to call stopPropagation. */
    const clickProbe = (target) => ({
      keep: !!target.closest?.('#sheet, .cal-notes, .vod.item, .cal-pop, .cal-cell.streamed, .pop2, .toasts'),
      day: !pop.hidden && (pop.contains(target) || !!target.closest?.('.cal-cell.streamed')),
    });
    let clickedIn = null;
    /* pointerdown, not click — the earliest moment there is.
     
       Recording it on click capture was still too late. Pressing the mouse on
       one element blurs whatever was focused, and committing an inline edit
       collapses a three-row textarea back to one line of text. The sheet is
       anchored to the bottom of the window, so it shrinks upward: by the time
       mouseup lands, the point you pressed is above the sheet's top edge, the
       click target is <body>, and the page concludes you clicked outside and
       closes the panel you were editing. Asking at pointerdown is asking
       before any of that can happen. */
    addEventListener('pointerdown', (e) => { clickedIn = clickProbe(e.target); }, true);
    document.addEventListener('click', (e) => {
      // No pointerdown means the keyboard did it, and the live target is right.
      const at = clickedIn ?? clickProbe(e.target);
      clickedIn = null;
      if (!pop.hidden && !at.day) closeDay();
      if (!at.keep && (selectedVod || !sheet.hidden)) closeSheet();
    });


    /* =====================================================================
       Layer 3 — theater
       =====================================================================
       Everything below draws against ONE number line: the axis, which is
       seconds since stream.started_at. The server hands back segments, notes
       and coverage already converted onto it, so nothing here re-derives a
       timestamp. The only conversion that happens in the browser is the one
       that has to: the live playhead, because a player reports its position in
       its own clock and does so sixty times a minute.

         axis     = playerPosition + source.covers_s[0]
         position = axis - source.covers_s[0]

       covers_s[0] IS start_wall - axis.zero_wall. One subtraction, one place.
       ===================================================================== */

    const TH = {
      root: document.getElementById('th'),
      scrim: document.getElementById('th-scrim'),
      idx: document.getElementById('th-idx'),
      title: document.getElementById('th-title'),
      metapills: document.getElementById('th-metapills'),
      tags: document.getElementById('th-tags'),
      srcbar: document.getElementById('th-srcbar'),
      rail: document.getElementById('th-rail'),
      player: document.getElementById('th-player'),
      tl: document.getElementById('th-tl'),
      tlbody: document.getElementById('th-tlbody'),
      pins: document.getElementById('th-pins'),
      track: document.getElementById('th-track'),
      cov: document.getElementById('th-cov'),
      axis: document.getElementById('th-axis'),
      hair: document.getElementById('th-hair'),
      ghost: document.getElementById('th-ghost'),
      mark: document.getElementById('th-mark'),
      drawBtn: document.getElementById('th-draw'),
      head: document.getElementById('th-playhead'),
      bubble: document.getElementById('th-bubble'),
      pop: document.getElementById('th-pop'),
      nodomain: document.getElementById('th-nodomain'),
      now: document.getElementById('th-now'),
      legend: document.getElementById('th-legend'),
      notes: document.getElementById('th-notes'),
      chat: document.getElementById('th-chat'),
      count: document.getElementById('th-count'),
      foot: document.getElementById('th-foot'),
    };

    let thS = null;        // the raw detail payload — the theater speaks it directly
    let thSrc = null;      // active source
    let thPlay = null;     // { time(), seek(s), destroy() }
    let thAxis = 0;        // last known axis position
    let thTick = null;
    let thPinned = [];     // the notes actually drawn on the strip, in pin order
    const thCache = new Map();

    const KINDS = ['game', 'person', 'type', 'meta'];
    const KIND_LABEL = { game: 'game', person: 'person', type: 'type',
                         meta: 'meta', unknown: 'unlabelled' };
    /* The legend is four words long, and four words cannot carry what 'type'
       and 'meta' mean. The gloss goes in the tooltip so the strip stays a
       strip. */
    const KIND_GLOSS = {
      game: 'A specific title being played',
      person: 'A guest, a member, a character this is about',
      type: 'What kind of stream this is — collab, karaoke, zatsudan, superchat reading, creative or event',
      meta: 'The scaffolding around the content — intro, outro, break, waiting screen',
      unknown: 'Nobody has said what this is. Not the same as a break.',
    };
    /* covers_s[0] is start_wall - zero_wall: where this source's own t=0 lands
       on the archive's axis. Null when that clock has never been measured, and
       null means "cannot convert", not "zero". */
    const covStart = (src) => (src && src.covers_s ? src.covers_s[0] : null);
    const domainOf = (s) => (s?.axis?.domain_s ?? null);
    const thPct = (x) => {
      const d = domainOf(thS);
      return d ? Math.max(0, Math.min(100, (x / d) * 100)) : 0;
    };
    const thHms = (t) => {
      const s = Math.max(0, Math.round(t || 0));
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
      return h ? `${h}:${pad2(m)}:${pad2(s % 60)}` : `${m}:${pad2(s % 60)}`;
    };

    /* ---- player adapters -------------------------------------------------
       Three sources, three SDKs, one interface: time(), seek(), destroy().
       Everything above this line is clock arithmetic and knows nothing about
       which player it is driving. */

    function loadScript(id, src) {
      return new Promise((res, rej) => {
        const have = document.getElementById(id);
        if (have) return have._loaded ? res() : have.addEventListener('load', () => res());
        const s = document.createElement('script');
        s.id = id; s.src = src;
        s.addEventListener('load', () => { s._loaded = true; res(); });
        s.addEventListener('error', () => rej(new Error(`could not load ${src}`)));
        document.head.append(s);
      });
    }
    function ytApi() {
      if (window.YT && window.YT.Player) return Promise.resolve();
      return new Promise((res, rej) => {
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { if (prev) prev(); res(); };
        loadScript('yt-iframe-api', 'https://www.youtube.com/iframe_api').catch(rej);
        setTimeout(() => rej(new Error('YouTube iframe API did not load')), 12000);
      });
    }

    async function makePlayer(src, atPosition) {
      const box = TH.player;
      const start = Math.max(0, Math.round(atPosition || 0));

      if (src.kind === 'youtube') {
        await ytApi();
        const holder = document.createElement('div');
        box.append(holder);
        const p = await new Promise((res) => {
          const inst = new YT.Player(holder, {
            host: 'https://www.youtube-nocookie.com',
            videoId: src.id,
            playerVars: { autoplay: 1, rel: 0, start, origin: location.origin,
                          playsinline: 1 },
            events: { onReady: () => res(inst) },
          });
        });
        return { time: () => { try { return p.getCurrentTime() || 0; } catch { return 0; } },
                 seek: (t) => { try { p.seekTo(Math.max(0, t), true); } catch { /* not ready */ } },
                 destroy: () => { try { p.destroy(); } catch { /* already gone */ } } };
      }

      if (src.kind === 'twitch') {
        await loadScript('tw-embed-api', 'https://player.twitch.tv/js/embed/v1.js');
        const holder = document.createElement('div');
        holder.id = 'tw-' + Math.random().toString(36).slice(2);
        box.append(holder);
        // Twitch checks `parent` against the hostname serving this page and
        // rejects bare IPs outright, so a 127.0.0.1 URL fails here no matter
        // what the archive does. srcTitle() says so on the button.
        const p = new Twitch.Player(holder.id, {
          video: src.id, parent: [location.hostname || 'localhost'],
          width: '100%', height: '100%', autoplay: true,
          time: hmsShort(start),
        });
        return { time: () => { try { return p.getCurrentTime() || 0; } catch { return 0; } },
                 seek: (t) => { try { p.seek(Math.max(0, t)); } catch { /* not ready */ } },
                 destroy: () => { try { p.destroy(); } catch { /* already gone */ } holder.remove(); } };
      }

      if (src.kind === 'local') {
        const v = document.createElement('video');
        v.controls = true; v.autoplay = true; v.playsInline = true;
        v.preload = 'metadata';
        v.src = `/media/video/${encodeURIComponent(src.capture_id)}`;
        v.addEventListener('loadedmetadata', () => { if (start) v.currentTime = start; });
        v.addEventListener('error', () => {
          // A media element fires `error` for aborted range requests too, and
          // Chromium aborts the first one on every seek. Only a set v.error is
          // an actual failure. Acting on the bare event tore the <video> out of
          // the DOM while thPlay still pointed at it — and a detached element
          // reports currentTime 0, so the playhead silently snapped to the
          // start of the source. An error path quietly corrupting the clock is
          // the exact failure this whole model exists to prevent.
          if (!v.error) return;
          thFailed('This file is not being served',
            'TENMA_MEDIA_ROOT is unset, or the path on disk no longer matches.');
        });
        box.append(v);
        return { time: () => v.currentTime || 0,
                 seek: (t) => { v.currentTime = Math.max(0, t); },
                 destroy: () => { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); } };
      }
      throw new Error(`no player for ${src.kind}`);
    }

    /* One place that tears a player down and says why, so the reference and
       the DOM can never disagree about whether something is playing. */
    function thFailed(head, sub) {
      if (thPlay) { try { thPlay.destroy(); } catch { /* already gone */ } thPlay = null; }
      TH.player.innerHTML = thGone(head, sub);
      TH.head.hidden = true;
    }

    const thGone = (head, sub) =>
      `<div class="th-gone">
         <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l18 18"/><path d="M10.6 5H19a2 2 0 0 1 2 2v8.4M21 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 1.6-2"/></svg>
         <b>${esc(head)}</b><span>${esc(sub)}</span></div>`;

    /* ---- mounting a source, without losing the moment -------------------- */

    async function thMount(src, atAxis) {
      if (thPlay) { try { thPlay.destroy(); } catch { /* ignore */ } thPlay = null; }
      TH.player.innerHTML = '';
      thSrc = src || null;
      thRenderSources();
      if (!src) return;

      const c0 = covStart(src);
      if (c0 === null) {
        TH.player.innerHTML = thGone('This source has no clock',
          'Nothing has measured when this file starts, so a position in it cannot be placed on the timeline.');
        return;
      }
      TH.player.innerHTML = '<span class="glyph">' +
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';
      try {
        thPlay = await makePlayer(src, (atAxis ?? thAxis) - c0);
        TH.head.hidden = false;
      } catch (e) {
        console.error(e);
        thFailed('The player would not load', e.message);
      }
    }

    /* The only browser-side conversion, and the reason sources carry a clock. */
    function thAxisNow() {
      if (!thPlay || !thSrc) return thAxis;
      const c0 = covStart(thSrc);
      if (c0 === null) return thAxis;
      const t = thPlay.time();
      // A torn-down player still answers, and it answers 0. A non-finite
      // reading is "no reading", not "the start of the stream".
      return Number.isFinite(t) ? t + c0 : thAxis;
    }
    function thSeek(axisSeconds) {
      thAxis = axisSeconds;
      const c0 = covStart(thSrc);
      if (thPlay && c0 !== null) thPlay.seek(axisSeconds - c0);
      thPaint();
    }

    /* ---- render ---------------------------------------------------------- */

    function thRenderSources() {
      const list = thS.sources || [];
      if (!list.length) {
        TH.srcbar.innerHTML = '<button disabled title="No source on record">no source</button>';
        return;
      }
      // Only the pressed state changes when you switch source, so only the
      // pressed state is written. Re-rendering the bar replaced the button
      // between the two clicks of a double-click, and the browser then fires
      // no dblclick at all — which is how the record editor became unreachable
      // from here without anything appearing to be wrong.
      // Counts source buttons only, so the wrench appended after them is not
      // mistaken for a length change and the bar is not rebuilt on every press.
      const have = [...TH.srcbar.querySelectorAll('[data-thsrc]')];
      if (have.length === list.length) {
        have.forEach((b, i) => b.setAttribute('aria-pressed', String(list[i] === thSrc)));
        return;
      }
      TH.srcbar.innerHTML = list.map((w, i) => {
        const dead = w.available === 'dead';
        const noClock = covStart(w) === null;
        const off = !w.embeddable && w.kind !== 'local';
        const bad = dead || noClock || off;
        const why = noClock ? 'No clock recorded for this source yet'
          : dead ? 'The platform no longer has this'
          : (w.kind === 'twitch' && IP_HOST)
            ? `Twitch will refuse to embed on ${location.hostname} — reach this page as localhost`
            : w.kind === 'local' ? 'Served from disk, if TENMA_MEDIA_ROOT is set'
            : 'Play here';
        return `<button data-thsrc="${i}" aria-pressed="${String(w === thSrc)}"
          title="${esc(why)}"${bad && w.kind !== 'local' ? ' disabled' : ''}>${esc(
          w.kind === 'local' ? `local ${w.platform || ''}`.trim() : w.kind)}${
          dead ? ' (dead)' : ''}${w.kind === 'twitch' && IP_HOST ? ' ⚠' : ''}</button>`;
      }).join('') + (ME.can?.edit
        // The double-click is still there, but nothing about a row of source
        // buttons suggests one, and an affordance you have to be told about is
        // not an affordance. Hidden entirely without edit rights rather than
        // shown disabled — there is nothing here for a viewer to want.
        ? '<button class="th-wrench" data-thwrench title="Edit this record"'
          + ' aria-label="Edit this record">'
          + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
          + ' stroke-linecap="round" stroke-linejoin="round">'
          + '<path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3Z"/></svg></button>'
        : '');
    }

    function thRenderRail() {
      const nb = thS.neighbours || { older: [], newer: [] };
      const here = { id: thS.id, idx: thS.idx, title: thS.title, thumb: thS.thumb,
                     started_at: thS.started_at, current: true };
      // Newest on the LEFT, oldest on the right — the same direction the index
      // grid reads, so moving between the two does not reverse under you.
      const all = [...nb.newer].reverse().concat(here, [...nb.older].reverse());
      TH.rail.innerHTML = all.map((n) => `
        <button class="th-nb" data-thnb="${esc(n.id)}"${n.current ? ' aria-current="true"' : ''}
          title="${esc(n.title || '')}">
          <span class="nb-thumb ph" style="--hue:${hueOf(n.id)}">
            ${n.thumb ? `<img src="${esc(n.thumb)}" alt="" loading="lazy" onerror="this.hidden=true">` : ''}
            <span class="nb-idx">${n.idx ? pad4(n.idx) : '—'}</span>
          </span>
          <span class="nb-title">${esc(n.title || '(untitled)')}</span>
        </button>`).join('');
      requestAnimationFrame(() => {
        const cur = TH.rail.querySelector('[aria-current="true"]');
        if (cur) TH.rail.scrollLeft = cur.offsetLeft - (TH.rail.clientWidth / 2) + 56;
      });
    }

    function thRenderTimeline() {
      const D = domainOf(thS);
      // A fresh payload means the blocks under the cursor are not the ones the
      // half-finished drawing was measured against. Start clean.
      drawSetMode(false);
      TH.drawBtn.hidden = !(D && ME.can?.suggest);
      TH.drawBtn.title = 'Proposes a block from the last chapter to the playhead. '
        + 'Click a different start, or type, to replace it. Alt turns snapping off.'
        + (ME.can?.edit ? '' : ' Yours will be queued for review.');
      const segs = thS.segments || [];
      const timed = (thS.notes || []).filter((n) => n.start_s !== null && n.start_s !== undefined);

      // Legend only lists kinds actually on this strip, plus unlabelled if any.
      const kinds = [...new Set(segs.map((s) => s.kind))];
      TH.legend.innerHTML = kinds.map((k) =>
        `<b title="${esc(KIND_GLOSS[k] || '')}"><i class="${k === 'unknown' ? 'hatch' : ''}" style="${
          k === 'unknown' ? '' : `background:var(--seg-${k})`}"></i>${esc(KIND_LABEL[k] || k)}</b>`).join('');

      if (!D) {
        // No duration means no domain. Nothing here can be drawn to scale, and
        // drawing it anyway against a guessed length is the lie the whole clock
        // model exists to avoid.
        TH.nodomain.innerHTML = `
          <span class="pill">no duration on record</span>
          <span>Nothing has measured how long this stream is, so there is no
          timeline to scale to.${segs.length ? ` ${segs.length} segment(s) and` : ''}
          ${(thS.notes || []).length} note(s) are listed in the panel.</span>`;
        TH.nodomain.hidden = false;
        TH.tlbody.classList.add('nodomain');
        TH.head.hidden = true;
        TH.now.hidden = true;
        return;
      }
      TH.nodomain.hidden = true;
      TH.tlbody.classList.remove('nodomain');
      TH.now.hidden = false;

      TH.track.innerHTML = segs.map((s) => {
        const w = thPct(s.end_s) - thPct(s.start_s);
        const bg = s.kind === 'unknown' ? '' : `background:var(--seg-${s.kind});`;
        const label = s.label || (s.synthetic ? '' : KIND_LABEL[s.kind] || '');
        return `<div class="th-seg ${esc(s.kind)}" style="left:${thPct(s.start_s)}%;width:${w}%;${bg}"
          title="${esc((s.label || KIND_LABEL[s.kind]))} · ${thHms(s.start_s)}–${thHms(s.end_s)}"
          ><span>${esc(label)}</span></div>`;
      }).join('');

      // Only notes that actually land on the strip get a pin. thPct() clamps,
      // so an offset past the end would otherwise be drawn at 100% — a note
      // claiming to be the finale because its timestamp is junk. They stay in
      // the panel, flagged, where the number can be read and corrected.
      thPinned = timed.filter((n) => n.start_s >= 0 && n.start_s <= D);
      TH.pins.innerHTML = thPinned.map((n, i) => {
        const p = n.precision_s || 0;
        const bandW = p > 15 ? (thPct(2 * p) - thPct(0)) : 0;
        return `<button class="th-pin${p >= 60 ? ' fuzzy' : ''}" data-thpin="${i}"
          style="left:${thPct(n.start_s)}%" aria-label="${esc(n.text)}"
          >${bandW ? `<span class="band" style="width:${Math.max(bandW, 2)}%"></span>` : ''}</button>`;
      }).join('');

      // Per-source coverage. Negative starts are real — a Twitch VOD that began
      // before the axis zero — and clamping only affects the drawing.
      TH.cov.innerHTML = (thS.coverage || []).filter((c) => c.to_s !== null).map((c) => {
        const cls = c.clock === 'local' ? 'local' : (c.platform === 'YT' ? 'yt' : 'tw');
        const a = thPct(c.from_s), b = thPct(c.to_s);
        return `<i class="${cls}" style="left:${a}%;width:${Math.max(b - a, 0.4)}%"
          title="${esc(c.platform)} ${esc(c.clock)} covers ${thHms(c.from_s)}–${thHms(c.to_s)}"></i>`;
      }).join('');

      const step = D > 6 * 3600 ? 3600 : D > 2 * 3600 ? 1800 : D > 1800 ? 600 : 120;
      let ticks = '';
      for (let t = 0; t <= D; t += step) {
        const major = t % (step * 2) === 0;
        ticks += `<span class="th-tick${major ? '' : ' minor'}" style="left:${thPct(t)}%">${
          major ? thHms(t).replace(/:\d\d$/, '') : ''}</span>`;
      }
      TH.axis.innerHTML = ticks;
      TH.head.hidden = false;
    }

    function thRenderPanel() {
      const notes = thS.notes || [];
      const canAdd = !!ME.can?.suggest;
      /* At the TOP here, not the bottom. In the theater you are writing while
         something plays, and the field you type into should not walk down the
         page as the list grows. */
      const add = canAdd ? `<div class="nt-new"><input type="text" data-notenew="${esc(thS.id)}"
          placeholder="Add a note…  !playhead = now"
          title="One line: an optional #tag, an optional number, the text, and an optional timestamp in brackets at the end. Type !playhead anywhere to drop the current position in. Enter saves it."
          autocomplete="off" spellcheck="false"></div>` : '';

      TH.notes.innerHTML = add + (notes.length ? groupedNotes(notes,
        (label) => `<div class="nt-group">${esc(label)}</div>`,
        (n) => {
          const ts = n.start_s === null || n.start_s === undefined ? '—' : (n.at || thHms(n.start_s));
          const none = n.start_s === null || n.start_s === undefined;
          const D = domainOf(thS);
          const past = !none && D && (n.start_s < 0 || n.start_s > D);
          const box = noteHasBox(n)
            ? `<button class="ob-box" data-ntdone="${esc(n.id)}" aria-pressed="${n.done ? 'true' : 'false'}"
                 title="${canAdd ? (n.done ? 'Done — click to un-tick' : 'Click to tick off')
                   : 'Sign in to change this'}"${canAdd ? '' : ' disabled'}></button>`
            : '<span class="ob-nobox"></span>';
          // The id, not the index. The list is grouped by tag, so a row's
          // position stopped meaning anything the moment that sort landed.
          return `<div class="nt${canAdd ? ' editable' : ''}" data-thnote="${esc(n.id)}"${
            canAdd ? ` data-ntedit="${esc(n.id)}"` : ''} title="${esc(
            none ? 'No timestamp on this note'
            : past ? `${ts} is outside this stream's ${thHms(domainOf(thS))} — the timestamp is wrong, or the duration is`
            : n.exact ? `Measured on ${clockName(n)}`
            : `Imported timestamp, good to about ${n.precision_s ?? '?'}s — nobody recorded which clock`)}">
            ${box}<span class="nt-x${n.done ? ' done' : ''}">${esc(n.text) || '<i>no text yet</i>'}</span>
            <span class="nt-when"><i class="nt-clk ${clockClass(n)}"></i
              ><span class="nt-ts${none ? ' none' : past ? ' past' : n.exact ? '' : ' fuzzy'}">${esc(ts)}</span></span>
            </div>`;
        })
        : '<div class="th-empty"><b>No notes yet</b>Nothing has been marked on this stream.</div>');

      // The chat panel is honest about which kind of "no chat" this is rather
      // than showing an empty list. present-but-not-imported is a different
      // claim from never-existed, and the archive is built on that difference.
      const c = thS.chat || {};
      const files = (c.sources || []).length;
      const msg = c.imported ? null
        : c.state === 'present' && files
          ? [`${files} chat log${files > 1 ? 's' : ''} on disk, not imported yet`,
             'The files are there. Nothing reads them into the archive yet, so there is nothing to replay.']
        : c.state === 'never' ? ['No chat was ever captured', 'This broadcast has no chat log on record.']
        : c.state === 'lost' ? ['The chat log is gone', 'It was recorded once and the file is no longer on disk.']
        : ['Chat has not been checked', 'No media root is configured, so the archive cannot tell whether the log is still there.'];
      TH.chat.innerHTML = `<div class="th-empty"><b>${esc(msg[0])}</b>${esc(msg[1])}</div>`;

      thPanelCount();
    }
    function thPanelCount() {
      const onNotes = !TH.notes.hidden;
      const n = (thS.notes || []).length;
      TH.count.textContent = onNotes
        ? `${n} note${n === 1 ? '' : 's'}`
        : ((thS.chat?.sources || []).length + ' log(s)');
      const fuzzy = thS.counts?.notes_unknown_frame ?? 0;
      const D = domainOf(thS);
      const past = D ? (thS.notes || []).filter((x) =>
        x.start_s != null && (x.start_s < 0 || x.start_s > D)).length : 0;
      TH.foot.textContent = onNotes
        ? (!n ? 'nothing marked yet'
             : past ? `${past} of ${n} land outside this stream`
             : fuzzy ? `${fuzzy} of ${n} not yet pinned to a clock`
             : 'all timestamps pinned')
